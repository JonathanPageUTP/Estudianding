<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Repaso GPI · Módulo 1</title>
<style>
:root{
  --bg:#0a100c;
  --bg-2:#0f1712;
  --surface:#132019;
  --surface-2:#182a20;
  --edge:#22352b;
  --text:#eaf2ec;
  --text-dim:#8fa79a;
  --text-faint:#5e7268;
  --brand:#37b978;
  --brand-dim:#245b3e;
  --brand-glow:rgba(55,185,120,.18);
  --gold:#e0a458;
  --gold-dim:#4a3620;
  --gold-glow:rgba(224,164,88,.16);
  --danger:#d97a6b;
  --radius-l:22px;
  --radius-m:14px;
  --radius-s:9px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(55,185,120,.14), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  overflow-x:hidden;
}
.app{
  width:100%;
  max-width:460px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  padding-top:var(--safe-t);
}

/* ---------- HEADER ---------- */
header{
  padding:18px 18px 10px;
  flex-shrink:0;
}
.brand-row{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:2px;
}
.brand-row h1{
  font-size:1.32rem;
  font-weight:800;
  letter-spacing:-.02em;
  margin:0;
}
.brand-row h1 em{
  font-style:normal;
  color:var(--brand);
}
.subtitle{
  font-size:.76rem;
  color:var(--text-faint);
  margin:0 0 14px;
}

/* progress bar */
.progress-wrap{
  height:9px;
  border-radius:99px;
  background:var(--surface-2);
  overflow:hidden;
  border:1px solid var(--edge);
  margin-bottom:12px;
}
.progress-fill{
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,var(--brand-dim),var(--brand));
  transition:width .4s cubic-bezier(.4,0,.2,1);
  width:0%;
}

.stats-row{
  display:flex;
  gap:8px;
  font-size:.72rem;
  color:var(--text-dim);
  margin-bottom:14px;
  flex-wrap:wrap;
}
.stat-pill{
  display:flex;
  align-items:center;
  gap:5px;
  background:var(--surface);
  border:1px solid var(--edge);
  padding:5px 10px;
  border-radius:99px;
  font-weight:600;
}
.stat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot-learned{background:var(--brand);}
.dot-hard{background:var(--gold);}
.dot-new{background:var(--text-faint);}

/* filter tabs */
.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:2px;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex-shrink:0;
  padding:9px 15px;
  border-radius:99px;
  background:var(--surface);
  border:1px solid var(--edge);
  color:var(--text-dim);
  font-size:.8rem;
  font-weight:700;
  cursor:pointer;
}
.tab.active{
  background:var(--brand);
  border-color:var(--brand);
  color:#06140c;
}

/* ---------- CARD STAGE ---------- */
main{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:14px 18px 6px;
  min-height:0;
}
.counter{
  text-align:center;
  font-size:.78rem;
  font-weight:700;
  color:var(--text-dim);
  margin-bottom:12px;
  letter-spacing:.02em;
}
.counter b{color:var(--text);}

.stage{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:1600px;
  min-height:300px;
  touch-action: pan-y;
}
.card3d{
  position:relative;
  width:100%;
  max-width:400px;
  height:min(56vh,420px);
  min-height:280px;
  cursor:pointer;
}
.card-inner{
  position:relative;
  width:100%;
  height:100%;
  transition:transform .55s cubic-bezier(.34,1.15,.4,1);
  transform-style:preserve-3d;
}
.card3d.flipped .card-inner{transform:rotateY(180deg);}
.face{
  position:absolute;
  inset:0;
  border-radius:var(--radius-l);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  padding:26px 24px;
  display:flex;
  flex-direction:column;
  border:1px solid var(--edge);
  overflow-y:auto;
}
.face::-webkit-scrollbar{width:0;}
.face-front{
  background:linear-gradient(160deg,var(--surface-2),var(--surface));
  justify-content:center;
}
.face-back{
  background:linear-gradient(160deg,var(--surface),#0f1a14);
  transform:rotateY(180deg);
  justify-content:flex-start;
}
.face-tag{
  position:absolute;
  top:16px;
  left:16px;
  font-size:.62rem;
  font-weight:800;
  letter-spacing:.06em;
  color:var(--brand);
  background:var(--brand-glow);
  padding:4px 9px;
  border-radius:99px;
}
.face-status{
  position:absolute;
  top:16px;
  right:16px;
  font-size:1rem;
}
.cat-label{
  font-size:.68rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--text-faint);
  margin-bottom:10px;
}
.face-front .q-text{
  font-size:1.18rem;
  font-weight:700;
  line-height:1.42;
  color:var(--text);
}
.tap-hint{
  position:absolute;
  bottom:16px;
  left:0; right:0;
  text-align:center;
  font-size:.68rem;
  color:var(--text-faint);
  font-weight:600;
}
.face-back .a-label{
  font-size:.68rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--brand);
  margin-bottom:8px;
  margin-top:6px;
}
.face-back .a-text{
  font-size:1.02rem;
  line-height:1.5;
  color:var(--text);
  font-weight:500;
}
.a-text b, .a-text strong{color:var(--brand);}

/* ---------- RATE BUTTONS (only visible when flipped) ---------- */
.rate-row{
  display:flex;
  gap:10px;
  padding:14px 18px 4px;
  flex-shrink:0;
  opacity:0;
  transform:translateY(6px);
  pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
}
.rate-row.show{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}
.rate-btn{
  flex:1;
  border:none;
  border-radius:var(--radius-m);
  padding:14px 8px;
  font-size:.86rem;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  cursor:pointer;
}
.rate-hard{
  background:var(--gold-dim);
  color:var(--gold);
  border:1px solid #5c451f;
}
.rate-hard.on{background:var(--gold);color:#2a1c08;}
.rate-easy{
  background:var(--brand-dim);
  color:#a8f0c6;
  border:1px solid #2a5c40;
}
.rate-easy.on{background:var(--brand);color:#06140c;}

/* ---------- NAV CONTROLS ---------- */
nav.controls{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 18px calc(16px + var(--safe-b));
  flex-shrink:0;
}
.nav-btn{
  flex:1;
  background:var(--surface);
  border:1px solid var(--edge);
  color:var(--text);
  border-radius:var(--radius-m);
  padding:15px 6px;
  font-size:.92rem;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  cursor:pointer;
}
.nav-btn:active{background:var(--surface-2);}
.nav-btn:disabled{opacity:.35;}
.nav-btn.shuffle{
  flex:0 0 54px;
  font-size:1.15rem;
  padding:15px 0;
}
.nav-btn.shuffle.on{
  border-color:var(--brand);
  color:var(--brand);
  background:var(--brand-glow);
}

.empty-state{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px 30px;
  color:var(--text-dim);
  gap:10px;
}
.empty-state .emoji{font-size:2.4rem;}
.empty-state p{margin:0;font-size:.9rem;line-height:1.5;}
.empty-state button{
  margin-top:8px;
  background:var(--brand);
  color:#06140c;
  border:none;
  padding:11px 20px;
  border-radius:99px;
  font-weight:800;
  font-size:.82rem;
  cursor:pointer;
}

@media (min-width:480px){
  .app{max-width:420px; margin:0 auto; box-shadow:0 0 60px rgba(0,0,0,.4);}
}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand-row">
      <h1>Repaso <em>GPI</em></h1>
      <span style="font-size:.68rem;color:var(--text-faint);font-weight:700;">Módulo 1</span>
    </div>
    <p class="subtitle">Fundamentos de la Gerencia de Proyectos Informáticos</p>

    <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>

    <div class="stats-row">
      <span class="stat-pill"><span class="stat-dot dot-learned"></span>Aprendidas: <span id="statLearned">0</span></span>
      <span class="stat-pill"><span class="stat-dot dot-hard"></span>Por repasar: <span id="statHard">0</span></span>
      <span class="stat-pill"><span class="stat-dot dot-new"></span>Sin ver: <span id="statNew">0</span></span>
    </div>

    <div class="tabs" id="tabs">
      <div class="tab active" data-filter="all">Todas · 60</div>
      <div class="tab" data-filter="hard">Por repasar</div>
      <div class="tab" data-filter="learned">Aprendidas</div>
    </div>
  </header>

  <main>
    <div class="counter" id="counter"><b>1</b> de 60</div>

    <div class="stage" id="stage">
      <div class="card3d" id="card3d">
        <div class="card-inner" id="cardInner">
          <div class="face face-front">
            <span class="face-tag" id="tagFront">Tema</span>
            <span class="face-status" id="statusFront"></span>
            <div class="q-text" id="qText">Cargando…</div>
            <div class="tap-hint">Toca la tarjeta para ver la respuesta ↻</div>
          </div>
          <div class="face face-back">
            <span class="face-tag" id="tagBack">Tema</span>
            <span class="face-status" id="statusBack"></span>
            <div class="a-label">Respuesta</div>
            <div class="a-text" id="aText">…</div>
          </div>
        </div>
      </div>
    </div>

    <div class="rate-row" id="rateRow">
      <button class="rate-btn rate-hard" id="btnHard">😅 Difícil / Repasar</button>
      <button class="rate-btn rate-easy" id="btnEasy">✅ Aprendida</button>
    </div>
  </main>

  <nav class="controls">
    <button class="nav-btn" id="btnPrev">‹ Anterior</button>
    <button class="nav-btn shuffle" id="btnShuffle" title="Mezclar">🔀</button>
    <button class="nav-btn" id="btnNext">Siguiente ›</button>
  </nav>

</div>

<script>
(function(){
  "use strict";

  /* ========================================================
     60 FLASHCARDS — Fuente: Certificaciones_PM.html,
     CicloVida_Proyecto_vs_Producto.html, Mod1_Fundamentos.html,
     GPI_Modulo1_Fundamentos.pptx
  ======================================================== */
  var CARDS = [
    {cat:"Fundamentos", q:"¿Qué es un proyecto según el PMBOK®?", a:"Un <b>esfuerzo temporal</b> que se emprende para crear un producto, servicio o resultado <b>único</b>.<br><br><i>Mnemotecnia:</i> piensa en las 3 iniciales <b>T-U-P</b>: Temporal, Único, Progresivo."},
    {cat:"Fundamentos", q:"¿Qué significa que un proyecto sea \"temporal\"?", a:"Tiene un <b>inicio y un fin definidos</b>; concluye cuando se logran los objetivos (no es una actividad permanente)."},
    {cat:"Fundamentos", q:"¿Qué significa que el resultado de un proyecto sea \"único\"?", a:"El resultado <b>no es repetitivo</b>: cada proyecto produce algo distinto a la operación rutinaria de la organización."},
    {cat:"Fundamentos", q:"¿Qué es la \"elaboración progresiva\" de un proyecto?", a:"El proyecto se <b>detalla y refina</b> con mayor nivel de precisión a medida que avanza, en lugar de definirse todo desde el inicio."},
    {cat:"Fundamentos", q:"¿Cuáles son los tres elementos de la Triple Restricción?", a:"<b>Alcance, Tiempo y Costo.</b><br><br><i>Analogía:</i> son como las patas de un banco de 3 patas — si acortas una, el banco (la calidad) se tambalea."},
    {cat:"Fundamentos", q:"Si el alcance de un proyecto crece sin ajustar tiempo ni costo, ¿qué se sacrifica?", a:"La <b>calidad</b>: es el resultado del equilibrio entre alcance, tiempo y costo; forzar uno sin ajustar los otros la afecta."},
    {cat:"Fundamentos", q:"¿Qué es el \"scope creep\"?", a:"El <b>crecimiento no controlado del alcance</b> de un proyecto, sin ajustar tiempo, costo o calidad en consecuencia."},
    {cat:"Fundamentos", q:"¿Por qué los proyectos de TI son estratégicamente importantes?", a:"Porque habilitan la <b>transformación digital</b>, integran sistemas y datos del negocio, y son inversiones estratégicas con <b>alta incertidumbre</b>."},

    {cat:"Éxito y fracaso", q:"Nombra tres factores típicos de ÉXITO en un proyecto.", a:"Objetivos y alcance bien definidos, apoyo de la alta dirección e involucramiento de los stakeholders (también: equipo competente y gestión activa de riesgos)."},
    {cat:"Éxito y fracaso", q:"Nombra tres factores típicos de FRACASO en un proyecto.", a:"Requisitos ambiguos o cambiantes, estimaciones de tiempo/costo irreales y falta de patrocinio (también: comunicación deficiente y scope creep)."},
    {cat:"Casos reales", q:"Healthcare.gov (EE. UU., 2013): ¿qué falló?", a:"El portal de seguros de salud <b>colapsó el primer día</b> por un plazo político inamovible, contratistas sin integrar y pruebas insuficientes. Un equipo pequeño lo estabilizó en ~2 meses priorizando y probando."},
    {cat:"Casos reales", q:"Aeropuerto de Denver (años 90): ¿qué lección deja el sistema de equipaje?", a:"Un sistema automatizado demasiado ambicioso retrasó la apertura ~16 meses. <b>Lección:</b> dimensiona el alcance a lo viable y gestiona el riesgo desde el inicio."},
    {cat:"Casos reales", q:"FBI Virtual Case File (2000–2005): ¿qué pasó?", a:"Se <b>canceló sin usarse</b> tras invertir más de US$170 millones, por requisitos que cambiaban constantemente y una gestión débil."},
    {cat:"Casos reales", q:"e-Estonia (gobierno digital): ¿por qué fue un caso de ÉXITO?", a:"Digitalizó casi todos los servicios públicos con una <b>visión clara</b>, apoyo del Estado como patrocinador y <b>entregas incrementales</b> por etapas."},

    {cat:"Guías internacionales", q:"¿Cuáles son las tres guías internacionales de referencia en gestión de proyectos?", a:"La <b>Guía del PMBOK®</b> (PMI), la norma <b>ISO 21500/21502</b> y el método <b>PRINCE2</b>."},
    {cat:"Guías internacionales", q:"¿Qué es la Guía del PMBOK®?", a:"Conjunto de <b>buenas prácticas del PMI</b>, organizado por dominios y principios (7ª edición); es la base del enfoque predictivo, ágil e híbrido."},
    {cat:"Guías internacionales", q:"¿Qué es la norma ISO 21500 / 21502?", a:"Una <b>norma internacional</b> con directrices para la dirección y gestión de proyectos; es un marco de referencia neutral y global."},
    {cat:"Guías internacionales", q:"¿Qué es PRINCE2 y dónde se originó?", a:"Un <b>método estructurado por procesos y roles</b>, nacido en el <b>Reino Unido</b> para el sector público; hoy muy valorado en Europa y grandes proyectos."},
    {cat:"Tradicional vs. Ágil", q:"Menciona dos rasgos del enfoque TRADICIONAL (predictivo).", a:"Planificación detallada por adelantado y fases secuenciales (cascada), con alcance fijo y cambios controlados."},
    {cat:"Tradicional vs. Ágil", q:"Menciona dos rasgos del enfoque ÁGIL (adaptativo).", a:"Planificación iterativa e incremental en <b>sprints</b> cortos, con alcance flexible y entregas frecuentes de valor."},
    {cat:"Tradicional vs. Ágil", q:"¿Para qué tipo de requisitos es ideal cada enfoque?", a:"El <b>tradicional</b> es ideal para requisitos <b>estables</b>; el <b>ágil</b> es ideal para requisitos <b>cambiantes</b>."},

    {cat:"Organización", q:"¿Qué es una PMO y qué funciones cumple?", a:"<b>Project Management Office</b> (Oficina de Gestión de Proyectos): estandariza la metodología, gobierna el portafolio y da soporte a la dirección de proyectos."},
    {cat:"Organización", q:"En una estructura FUNCIONAL, ¿qué autoridad tiene el director de proyecto?", a:"<b>Baja.</b> La autoridad está en los gerentes de área; el PM coordina pero comparte los recursos y tiene poco poder formal."},
    {cat:"Organización", q:"En una estructura PROYECTIZADA, ¿qué autoridad tiene el director de proyecto?", a:"<b>Máxima.</b> La organización gira en torno a proyectos y el equipo reporta directamente al director de proyecto."},
    {cat:"Organización", q:"¿Qué caracteriza a una estructura MATRICIAL (mixta)?", a:"La autoridad se <b>comparte</b> entre los gerentes de área y el director de proyecto; puede ser débil, equilibrada o fuerte."},
    {cat:"Roles", q:"¿Cuál es el rol del Patrocinador (sponsor)?", a:"<b>Provee recursos y respaldo</b>; es quien autoriza el proyecto."},
    {cat:"Roles", q:"¿Cuál es el rol del Director de Proyecto (PM)?", a:"<b>Planifica, ejecuta y controla</b> el proyecto; es responsable de cumplir alcance, tiempo y costo."},
    {cat:"Roles", q:"¿Qué son los \"stakeholders\" o interesados?", a:"Personas o grupos que <b>afectan o son afectados</b> por el proyecto (ej. estudiantes, decano, TI y docentes en el ejemplo del portal de matrícula)."},

    {cat:"Ciclo del proyecto", q:"¿Cuáles son las 5 fases del ciclo de vida del PROYECTO?", a:"<b>Inicio → Planificación → Ejecución → Monitoreo y Control → Cierre.</b><br><br><i>Mnemotecnia:</i> \"Inicia, Planea, Ejecuta, Mide, Cierra\" (IPEMC)."},
    {cat:"Ciclo del proyecto", q:"¿Qué se produce en la fase de INICIO del proyecto?", a:"El <b>Acta de Constitución</b> (autorización, objetivos, interesados y restricciones); el esfuerzo es bajo."},
    {cat:"Ciclo del proyecto", q:"¿Qué se hace en la fase de PLANIFICACIÓN?", a:"Se detalla el alcance, cronograma, costos, riesgos, calidad y comunicaciones — se generan la EDT, el Gantt y el presupuesto."},
    {cat:"Ciclo del proyecto", q:"¿Qué caracteriza a la fase de EJECUCIÓN?", a:"Se construye el producto y se coordina al equipo; aquí se consume la <b>mayor parte del esfuerzo y del presupuesto</b>."},
    {cat:"Ciclo del proyecto", q:"¿Cómo se relaciona el Monitoreo y Control con la Ejecución?", a:"Lo <b>acompaña de forma continua</b>: compara lo real contra lo planificado y gestiona los cambios necesarios."},
    {cat:"Ciclo del proyecto", q:"¿Qué ocurre en la fase de CIERRE?", a:"Se entrega el producto, se documentan las <b>lecciones aprendidas</b> y se libera al equipo; el esfuerzo vuelve a ser bajo."},

    {cat:"Proyecto vs. Producto", q:"¿Cuál es la diferencia esencial entre el ciclo de vida del PROYECTO y del PRODUCTO?", a:"El del <b>proyecto</b> es temporal (de inicio a cierre); el del <b>producto</b> abarca toda su vida útil, incluyendo operación y mantenimiento."},
    {cat:"Proyecto vs. Producto", q:"¿Cuáles son las 5 etapas del ciclo de vida del PRODUCTO?", a:"<b>Desarrollo → Introducción → Crecimiento → Madurez → Declive/Retiro.</b>"},
    {cat:"Proyecto vs. Producto", q:"En el ciclo de vida del producto, ¿en qué etapa \"ocurre\" el proyecto?", a:"En la etapa de <b>Desarrollo</b>: ahí se concibe y construye el producto."},
    {cat:"Proyecto vs. Producto", q:"¿Cómo se relacionan un producto y sus proyectos a lo largo del tiempo?", a:"Un producto puede <b>contener varios proyectos</b> durante su vida: el que lo crea, y otros para mejorarlo, migrarlo o retirarlo."},
    {cat:"Proyecto vs. Producto", q:"En el ejemplo de la app de banca móvil, ¿cuándo termina el proyecto?", a:"Cuando la app se <b>publica</b> y se acepta el entregable (la versión 1.0)."},
    {cat:"Proyecto vs. Producto", q:"En el ejemplo de la app de banca móvil, ¿qué le pasa al producto después del proyecto?", a:"Sigue vivo por años: uso diario, mantenimiento, nuevas versiones y parches de seguridad. <b>Cada mejora es un nuevo proyecto.</b><br><br><i>Frase clave:</i> \"Un proyecto <b>crea</b> el producto; el producto <b>vive</b> mucho más allá del proyecto que lo originó.\""},

    {cat:"Carrera profesional", q:"¿Qué hace un Analista/Coordinador de Proyectos y qué certificación lo refuerza?", a:"Da <b>seguimiento a tareas, cronograma y documentación</b>, apoyando al director de proyecto. Certificación asociada: <b>CAPM</b>."},
    {cat:"Carrera profesional", q:"¿Qué hace un Scrum Master y qué certificaciones lo respaldan?", a:"<b>Facilita el marco ágil</b>, remueve obstáculos y protege al equipo. Certificaciones: <b>PSM</b> (Scrum.org) o <b>CSM</b> (Scrum Alliance)."},
    {cat:"Carrera profesional", q:"¿Qué hace un Product Owner?", a:"<b>Prioriza el Product Backlog</b> y maximiza el valor del producto entregado al cliente."},
    {cat:"Carrera profesional", q:"¿Cuál es la ruta de crecimiento TRADICIONAL sugerida?", a:"Estudiante → <b>CAPM</b> → experiencia (1–3 años) → <b>PMP</b> → PgMP / PfMP."},
    {cat:"Carrera profesional", q:"¿Cuál es la ruta de crecimiento ÁGIL sugerida?", a:"Estudiante → <b>PSM I / CSM</b> → práctica Scrum → PSM II / A-CSM → PSPO / CSPO."},

    {cat:"Certificaciones", q:"¿Qué es el PMI y qué guía publica?", a:"<b>Project Management Institute</b>: organización sin fines de lucro (EE. UU., 1969) que publica la Guía del PMBOK® y emite CAPM, PMP y PMI-ACP."},
    {cat:"Certificaciones", q:"¿Qué es la certificación PMP y cuáles son sus requisitos?", a:"<b>Project Management Professional</b> (PMI), la más valorada del mercado. Requiere título + 36 meses de experiencia + 35 h de formación; vigencia 3 años (60 PDU)."},
    {cat:"Certificaciones", q:"¿Qué es la certificación CAPM y para quién es ideal?", a:"<b>Certified Associate in Project Management</b> (PMI), nivel de entrada. Requiere secundaria + 23 h de formación; ideal para estudiantes sin experiencia."},
    {cat:"Certificaciones", q:"¿Qué es PMI-ACP?", a:"<b>PMI Agile Certified Practitioner</b>: certificación ágil del PMI que requiere 21 h de formación ágil más experiencia en proyectos ágiles."},
    {cat:"Certificaciones", q:"¿Qué diferencia a Scrum.org de Scrum Alliance en requisitos?", a:"<b>Scrum.org</b> (PSM/PSPO) <b>no exige curso obligatorio</b>; <b>Scrum Alliance</b> (CSM) exige un curso oficial presencial de 2 días."},
    {cat:"Certificaciones", q:"¿Qué es PSM I y cuánto cuesta aproximadamente?", a:"<b>Professional Scrum Master I</b> (Scrum.org); examen ~$200; certificación <b>vitalicia</b>, no expira."},
    {cat:"Certificaciones", q:"¿Qué es CSM y cuál es su costo aproximado?", a:"<b>Certified ScrumMaster</b> (Scrum Alliance); cuesta entre $1,000 y $1,400 (curso + examen); vigencia de 2 años."},
    {cat:"Certificaciones", q:"¿Qué organización creó SAFe y para qué sirve?", a:"<b>Scaled Agile, Inc.</b> creó el framework SAFe® (Scaled Agile Framework), usado para aplicar agilidad en grandes organizaciones con muchos equipos."},
    {cat:"Certificaciones", q:"¿Qué certificación ofrece Axelos/PeopleCert y dónde es más valorada?", a:"<b>PRINCE2</b> (Foundation y Practitioner); muy valorada en <b>Europa</b>, el sector público y grandes proyectos estructurados."},
    {cat:"Certificaciones", q:"¿Qué certificación de Google es ideal para principiantes?", a:"El <b>Google Project Management Certificate</b>, en la plataforma Coursera; sin requisitos, se completa en menos de 6 meses."},
    {cat:"Certificaciones", q:"¿Qué es CompTIA Project+ y qué la caracteriza?", a:"Certificación <b>vendor-neutral</b> de CompTIA, ideal para proyectos pequeños y equipos de TI; su vigencia es <b>vitalicia</b>."},
    {cat:"Certificaciones", q:"¿Qué beneficio da la membresía anual de PMI (~$164/año)?", a:"Otorga el <b>precio de \"socio\"</b>, más económico, al presentar cualquiera de los exámenes de certificación del PMI."},
    {cat:"Certificaciones", q:"Según la ruta recomendada, ¿por dónde debe empezar alguien SIN experiencia?", a:"Con el <b>Google PM Certificate</b> o la <b>CAPM</b>, para aprender los fundamentos antes de avanzar a certificaciones profesionales."},

    {cat:"Glosario", q:"¿Qué es la matriz RACI?", a:"Herramienta de asignación de responsabilidades: <b>R</b>esponsable (ejecuta), <b>A</b>probador (rinde cuentas, solo uno), <b>C</b>onsultado e <b>I</b>nformado."},
    {cat:"Glosario", q:"¿Qué es la EDT/WBS y cuál es su \"regla del 100%\"?", a:"<b>Estructura de Desglose del Trabajo</b> (Work Breakdown Structure): descompone el proyecto en entregables y paquetes de trabajo. La regla del 100% dice que debe incluir <b>todo</b> el trabajo, ni más ni menos."}
  ];

  var TOTAL = CARDS.length; // 60
  CARDS.forEach(function(c,i){ c.id = "c" + i; });

  /* ---------------- STORAGE ---------------- */
  var STORE_KEY = "gpi_flashcards_status_v1";
  var status = {}; // id -> "easy" | "hard"
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw) status = JSON.parse(raw) || {};
  }catch(e){ status = {}; }

  function saveStatus(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(status)); }catch(e){}
  }

  /* ---------------- STATE ---------------- */
  var order = CARDS.map(function(c,i){return i;});
  var filter = "all";
  var filteredOrder = order.slice();
  var pos = 0;
  var flipped = false;
  var shuffleOn = false;

  /* ---------------- DOM ---------------- */
  var $ = function(id){ return document.getElementById(id); };
  var stage = $("stage"), card3d = $("card3d"), cardInner = $("cardInner");
  var qText = $("qText"), aText = $("aText");
  var tagFront = $("tagFront"), tagBack = $("tagBack");
  var statusFront = $("statusFront"), statusBack = $("statusBack");
  var counter = $("counter");
  var progressFill = $("progressFill");
  var statLearned = $("statLearned"), statHard = $("statHard"), statNew = $("statNew");
  var rateRow = $("rateRow"), btnHard = $("btnHard"), btnEasy = $("btnEasy");
  var btnPrev = $("btnPrev"), btnNext = $("btnNext"), btnShuffle = $("btnShuffle");
  var tabs = document.querySelectorAll(".tab");

  function statusIcon(s){
    if(s === "easy") return "✅";
    if(s === "hard") return "😅";
    return "";
  }

  function computeStats(){
    var learned=0, hard=0;
    CARDS.forEach(function(c){
      var s = status[c.id];
      if(s === "easy") learned++;
      else if(s === "hard") hard++;
    });
    var news = TOTAL - learned - hard;
    return {learned:learned, hard:hard, news:news};
  }

  function refreshStats(){
    var st = computeStats();
    statLearned.textContent = st.learned;
    statHard.textContent = st.hard;
    statNew.textContent = st.news;
    var pct = Math.round((st.learned / TOTAL) * 100);
    progressFill.style.width = pct + "%";
  }

  function buildFilteredOrder(){
    var base = shuffleOn ? order : order.slice().sort(function(a,b){return a-b;});
    if(filter === "all"){
      filteredOrder = base.slice();
    } else if(filter === "hard"){
      filteredOrder = base.filter(function(i){ return status[CARDS[i].id] === "hard" || !status[CARDS[i].id]; });
      // "Por repasar" muestra difíciles + no vistas (aún no dominadas)
      // pero priorizamos mostrar solo lo NO aprendido: reinterpretación -> difíciles o sin marcar
      filteredOrder = base.filter(function(i){
        var s = status[CARDS[i].id];
        return s === "hard";
      });
      if(filteredOrder.length === 0){
        filteredOrder = base.filter(function(i){ return !status[CARDS[i].id]; });
      }
    } else if(filter === "learned"){
      filteredOrder = base.filter(function(i){ return status[CARDS[i].id] === "easy"; });
    }
  }

  function shuffleArray(arr){
    for(var i=arr.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp = arr[i]; arr[i]=arr[j]; arr[j]=tmp;
    }
    return arr;
  }

  function render(){
    refreshStats();
    if(filteredOrder.length === 0){
      renderEmpty();
      return;
    }
    if(pos >= filteredOrder.length) pos = filteredOrder.length - 1;
    if(pos < 0) pos = 0;

    stage.innerHTML = "";
    stage.appendChild(card3d);

    var cardIndex = filteredOrder[pos];
    var c = CARDS[cardIndex];
    var s = status[c.id];

    qText.textContent = c.q;
    aText.innerHTML = c.a;
    tagFront.textContent = c.cat;
    tagBack.textContent = c.cat;
    statusFront.textContent = statusIcon(s);
    statusBack.textContent = statusIcon(s);

    counter.innerHTML = "<b>" + (pos+1) + "</b> de " + filteredOrder.length;

    card3d.classList.remove("flipped");
    flipped = false;
    rateRow.classList.remove("show");

    btnHard.classList.toggle("on", s === "hard");
    btnEasy.classList.toggle("on", s === "easy");

    btnPrev.disabled = filteredOrder.length <= 1;
    btnNext.disabled = filteredOrder.length <= 1;
  }

  function renderEmpty(){
    stage.innerHTML =
      '<div class="empty-state">' +
        '<div class="emoji">' + (filter === "learned" ? "🌱" : "🎉") + '</div>' +
        '<p>' + (filter === "learned"
            ? "Aún no marcas tarjetas como aprendidas.<br>Repasa el mazo \"Todas\" y valora tu progreso."
            : "¡No tienes tarjetas por repasar!<br>Sigue así o vuelve a \"Todas\" para repasar más.") +
        '</p>' +
        '<button id="emptyBack">Ver todas las tarjetas</button>' +
      '</div>';
    counter.innerHTML = "<b>0</b> de 0";
    var btn = $("emptyBack");
    if(btn){
      btn.addEventListener("click", function(){
        setFilter("all");
      });
    }
  }

  function setFilter(f){
    filter = f;
    tabs.forEach(function(t){ t.classList.toggle("active", t.getAttribute("data-filter") === f); });
    pos = 0;
    buildFilteredOrder();
    render();
  }

  function flipCard(){
    if(filteredOrder.length === 0) return;
    flipped = !flipped;
    card3d.classList.toggle("flipped", flipped);
    rateRow.classList.toggle("show", flipped);
  }

  function goNext(){
    if(filteredOrder.length === 0) return;
    pos = (pos + 1) % filteredOrder.length;
    render();
  }
  function goPrev(){
    if(filteredOrder.length === 0) return;
    pos = (pos - 1 + filteredOrder.length) % filteredOrder.length;
    render();
  }

  function setRating(kind){
    if(filteredOrder.length === 0) return;
    var cardIndex = filteredOrder[pos];
    var c = CARDS[cardIndex];
    if(status[c.id] === kind){
      delete status[c.id]; // toggle off
    } else {
      status[c.id] = kind;
    }
    saveStatus();
    btnHard.classList.toggle("on", status[c.id] === "hard");
    btnEasy.classList.toggle("on", status[c.id] === "easy");
    statusFront.textContent = statusIcon(status[c.id]);
    statusBack.textContent = statusIcon(status[c.id]);
    refreshStats();

    // si estamos en un filtro y la tarjeta deja de pertenecer, la removemos del recorrido tras un instante
    if(filter !== "all"){
      setTimeout(function(){
        buildFilteredOrder();
        if(pos >= filteredOrder.length) pos = Math.max(0, filteredOrder.length - 1);
        render();
      }, 380);
    }
  }

  function toggleShuffle(){
    shuffleOn = !shuffleOn;
    btnShuffle.classList.toggle("on", shuffleOn);
    if(shuffleOn){
      shuffleArray(order);
    } else {
      order.sort(function(a,b){return a-b;});
    }
    pos = 0;
    buildFilteredOrder();
    render();
  }

  /* ---------------- EVENTS ---------------- */
  card3d.addEventListener("click", flipCard);
  btnNext.addEventListener("click", goNext);
  btnPrev.addEventListener("click", goPrev);
  btnShuffle.addEventListener("click", toggleShuffle);
  btnHard.addEventListener("click", function(e){ e.stopPropagation(); setRating("hard"); });
  btnEasy.addEventListener("click", function(e){ e.stopPropagation(); setRating("easy"); });
  tabs.forEach(function(t){
    t.addEventListener("click", function(){ setFilter(t.getAttribute("data-filter")); });
  });

  // swipe gestures (left/right) on stage
  var touchStartX = null, touchStartY = null;
  stage.addEventListener("touchstart", function(e){
    var t = e.touches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
  }, {passive:true});
  stage.addEventListener("touchend", function(e){
    if(touchStartX === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStartX;
    var dy = t.clientY - touchStartY;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.4){
      if(dx < 0) goNext(); else goPrev();
    }
    touchStartX = null; touchStartY = null;
  }, {passive:true});

  // keyboard support (desktop testing)
  document.addEventListener("keydown", function(e){
    if(e.key === "ArrowRight") goNext();
    else if(e.key === "ArrowLeft") goPrev();
    else if(e.key === " "){ e.preventDefault(); flipCard(); }
  });

  /* ---------------- INIT ---------------- */
  buildFilteredOrder();
  render();

})();
</script>
</body>
</html>
