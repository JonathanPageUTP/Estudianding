<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Mis Dudas | Charla Política de Adquisición</title>
    <style>
        :root { --bg:#ffffff; --fg:#000000; --sub:#555555; --line:#e6e6e6; --soft:#f6f6f6; }
        html[data-theme="dark"] { color-scheme: dark; --bg:#0e0e0e; --fg:#f2f2f2; --sub:#a8a8a8; --line:#2a2a2a; --soft:#171717; }
        * { box-sizing: border-box; }
        body {
            margin: 0; background: var(--bg); color: var(--fg);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: clamp(15px, 1rem + 0.2vw, 18px); line-height: 1.55;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .container { max-width: 720px; margin: 0 auto; padding: 96px 16px 60px; }
        h1 { font-weight: 200; letter-spacing: 4px; text-transform: uppercase; font-size: 1.5rem; text-align: center; margin: 0 0 8px; }
        .lead { text-align: center; color: var(--sub); font-size: .9rem; margin: 0 0 32px; }

        .search { width: 100%; padding: 14px 16px; font-size: 1rem; border: 1px solid var(--fg); background: transparent; color: inherit; margin-bottom: 24px; min-height: 44px; }
        .search:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

        .qa { border-top: 1px solid var(--line); }
        .qa:last-of-type { border-bottom: 1px solid var(--line); }
        .qa summary {
            list-style: none; cursor: pointer; padding: 18px 36px 18px 0; position: relative;
            font-weight: 600; min-height: 44px;
        }
        .qa summary::-webkit-details-marker { display: none; }
        .qa summary::after { content: "+"; position: absolute; right: 4px; top: 14px; font-weight: 200; font-size: 1.6rem; line-height: 1; }
        .qa[open] summary::after { content: "−"; }
        .qa summary:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
        .num { display: inline-block; min-width: 2.2em; color: var(--sub); font-weight: 400; letter-spacing: 1px; }
        .tema { display: inline-block; font-size: .65rem; letter-spacing: 2px; text-transform: uppercase; border: 1px solid currentColor; padding: 2px 8px; margin-left: 6px; vertical-align: middle; font-weight: 400; color: var(--sub); }
        .ans { padding: 0 0 22px 2.2em; }
        .ans p { margin: 0 0 12px; }
        .ans ul, .ans ol { margin: 0 0 12px; padding-left: 1.2em; }
        .ans li { margin-bottom: 6px; }
        .clave { background: var(--soft); border-left: 3px solid var(--fg); padding: 10px 14px; margin: 12px 0; font-size: .92rem; }
        .clave b:first-child { letter-spacing: 1px; text-transform: uppercase; font-size: .72rem; display: block; margin-bottom: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: .88rem; margin: 0 0 12px; display: block; overflow-x: auto; }
        th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
        th { background: var(--soft); font-weight: 600; }

        .empty { text-align: center; color: var(--sub); border: 1px dashed var(--line); padding: 40px 16px; }
        .nores { display: none; text-align: center; color: var(--sub); padding: 30px 0; }

        /* Navegación y tema (igual que index) */
        .navc { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; display: flex; gap: 8px; z-index: 10; }
        .navc a, .theme-toggle {
            width: 44px; height: 44px; border-radius: 50%; border: 1px solid currentColor; background: var(--bg);
            color: inherit; display: flex; align-items: center; justify-content: center; text-decoration: none; padding: 0; cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); -webkit-tap-highlight-color: transparent;
        }
        .theme-toggle { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; z-index: 10; }
        .navc svg, .theme-toggle svg { width: 20px; height: 20px; }
        .navc a:focus-visible, .theme-toggle:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
        @media (hover: hover) { .navc a:hover, .theme-toggle:hover { background: var(--fg); color: var(--bg); border-color: var(--fg); } }
        .theme-toggle .i-sun { display: none; }
        html[data-theme="dark"] .theme-toggle .i-sun { display: block; }
        html[data-theme="dark"] .theme-toggle .i-moon { display: none; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }

        /* Lectura en voz alta */
        .tts-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; margin: 0 0 14px; border: 1px solid currentColor; background: transparent; color: inherit; font: inherit; font-size: .8rem; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; }
        @media (hover: hover) { .tts-btn:hover { background: var(--fg); color: var(--bg); } }
        .tts-btn:focus-visible, #player button:focus-visible, #player select:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
        .tts-on { outline: 2px solid var(--fg); outline-offset: 4px; background: var(--soft); }
        #player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: none; align-items: center; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--fg); }
        #player.show { display: flex; }
        #player .now { flex: 1; min-width: 0; font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #player button, #player select { min-width: 44px; height: 44px; border: 1px solid currentColor; background: transparent; color: inherit; font: inherit; cursor: pointer; }
        #player select { padding: 0 6px; }
        body.playing .container { padding-bottom: 120px; }
    </style>
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem("theme"); } catch (e) {}
            if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", t);
        })();
    </script>
</head>
<body>
    <nav class="navc" aria-label="Navegación">
        <a href="index.html" aria-label="Volver al menú anterior" title="Volver al menú anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
        <a href="../../../index.html" aria-label="Ir al inicio" title="Ir al inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5M10 21v-6h4v6"/></svg></a>
    </nav>

    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar a modo oscuro" title="Modo oscuro / claro">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>

    <main class="container">
        <h1>Mis Dudas</h1>
        <p class="lead">Preguntas que surgieron preparando la charla · Política de Adquisición Tecnológica</p>

        <input class="search" id="search" type="search" placeholder="Buscar en mis dudas…" aria-label="Buscar en mis dudas">

        <section id="lista">
            <!--
              PLANTILLA para cada duda:
              <details class="qa">
                  <summary><span class="num">01</span>Pregunta aquí <span class="tema">Hardware</span></summary>
                  <div class="ans">
                      <p>Respuesta…</p>
                      <div class="clave"><b>Para memorizar</b>Mnemotecnia en una línea.</div>
                      <div class="clave"><b>Ojo al exponer</b>Cómo decirlo en la charla.</div>
                  </div>
              </details>
            -->
        </section>

        <p class="empty" id="empty">Aún no hay dudas. Se irán agregando aquí a medida que surjan.</p>
        <p class="nores" id="nores">Ninguna duda coincide con la búsqueda.</p>
    </main>

    <script src="audio/dudas.js"></script>
    <script>
        (function () {
            var root = document.documentElement, btn = document.getElementById("themeToggle");
            function label() { btn.setAttribute("aria-label", root.getAttribute("data-theme") === "dark" ? "Cambiar a modo claro" : "Cambiar a modo oscuro"); }
            label();
            btn.addEventListener("click", function () {
                var t = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
                root.setAttribute("data-theme", t);
                try { localStorage.setItem("theme", t); } catch (e) {}
                label();
            });

            var items = Array.prototype.slice.call(document.querySelectorAll(".qa"));
            var empty = document.getElementById("empty"), nores = document.getElementById("nores"), search = document.getElementById("search");
            if (items.length) { empty.style.display = "none"; } else { search.style.display = "none"; }
            function norm(s) { return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
            search.addEventListener("input", function () {
                var q = norm(search.value.trim()), shown = 0;
                items.forEach(function (d) {
                    var ok = !q || norm(d.textContent).indexOf(q) !== -1;
                    d.style.display = ok ? "" : "none";
                    if (ok) shown++;
                    if (q && ok) d.open = true;
                });
                nores.style.display = shown ? "none" : "block";
            });

            /* ---------- Lectura en voz alta ---------- */
            var synth = window.speechSynthesis;
            var hasTTS = !!(synth && window.SpeechSynthesisUtterance);
            var AUD = window.DUDAS_AUDIO || {};
            function numOf(d) { var n = d.querySelector(".num"); return n ? n.textContent.trim() : ""; }
            function hasAudio(d) { return !!AUD[numOf(d)]; }
            if (!hasTTS && !items.some(hasAudio)) return;
            if (!hasTTS) synth = { cancel: function () {}, getVoices: function () { return []; } };
            var EXPAND = {
                "PETI": "PETI, Plan Estratégico de Tecnología de Información,",
                "TCO": "TCO, costo total de propiedad,",
                "SBP": "SBP, Superintendencia de Bancos de Panamá,",
                "MFA": "MFA, autenticación multifactor,",
                "SLA": "SLA, niveles de servicio,",
                "EDR": "EDR, protección de equipos,",
                "BI": "BI, inteligencia de negocios,",
                "SOC": "SOC, centro de monitoreo de seguridad,"
            };
            var said = {};
            var rate = 1;
            try { rate = +localStorage.getItem("gr_charlapf_dudas_rate") || 1; } catch (e) {}
            var voice = null;
            function pickVoice() {
                var vs = synth.getVoices().filter(function (v) { return /^es/i.test(v.lang); });
                voice = vs.filter(function (v) { return /es-(ES|MX|US|419)/i.test(v.lang); })[0] || vs[0] || null;
            }
            pickVoice(); if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = pickVoice;

            var player = document.createElement("div"); player.id = "player"; player.setAttribute("role", "region"); player.setAttribute("aria-label", "Reproductor de voz");
            player.innerHTML = '<span class="now" id="pNow"></span>' +
                '<button type="button" id="pPP" aria-label="Pausar">⏸</button>' +
                '<button type="button" id="pStop" aria-label="Detener">⏹</button>' +
                '<select id="pRate" aria-label="Velocidad">' + [0.8, 0.9, 1, 1.1, 1.2, 1.3].map(function (r) {
                    return '<option value="' + r + '"' + (r === rate ? " selected" : "") + '>' + r.toFixed(1) + '×</option>';
                }).join("") + '</select>';
            document.body.appendChild(player);

            function speakable(t) {
                t = t.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}]/gu, " ");
                t = t.replace(/↔/g, " y viceversa ").replace(/→/g, " lleva a ").replace(/·/g, ", ").replace(/[—–]/g, ", ")
                     .replace(/\|/g, ", y ").replace(/\t/g, ": ").replace(/\bRRHH\b/g, "recursos humanos").replace(/\bTI\b/g, "T I")
                     .replace(/\bHW\b/g, "hardware").replace(/\bSW\b/g, "software").replace(/\bCOM\b/g, "comunicaciones")
                     .replace(/\bJA\b/g, "Junta de Andalucía").replace(/(\d)\s?×/g, "$1 por");
                t = t.replace(/\b(PETI|TCO|SBP|MFA|SLA|EDR|BI|SOC)\b/g, function (m) { if (said[m]) return m; said[m] = 1; return EXPAND[m]; });
                return t.replace(/\s+/g, " ").trim();
            }
            function blocksOf(d) {
                var list = [d.querySelector("summary")].concat(Array.prototype.slice.call(d.querySelectorAll(".ans p, .ans li, .ans tr, .ans .clave")))
                    .filter(function (el) { return el && el.textContent.trim(); });
                return list.filter(function (el) { return !list.some(function (o) { return o !== el && o.contains(el); }); });
            }

            // Pausa propia: cancelar y recordar el bloque; reanudar = volver a leerlo (pause/resume falla en Chrome Android)
            var queue = [], qi = 0, curIdx = 0, curEl = null, playing = false, paused = false, gen = 0;
            function clearHi() { if (curEl) curEl.classList.remove("tts-on"); curEl = null; }
            function setPP() { var b = document.getElementById("pPP"); b.textContent = paused ? "▶" : "⏸"; b.setAttribute("aria-label", paused ? "Reanudar" : "Pausar"); }
            function next() {
                clearHi();
                if (!playing || qi >= queue.length) { stop(); return; }
                curIdx = qi;
                var el = queue[qi++];
                var raw = el.tagName === "SUMMARY" ? "Duda " + el.textContent : (el.innerText || el.textContent);
                var txt = speakable(raw);
                if (!txt) { next(); return; }
                curEl = el; el.classList.add("tts-on");
                var r = el.getBoundingClientRect();
                if (r.top < 90 || r.bottom > window.innerHeight - 110) el.scrollIntoView({ behavior: "smooth", block: "center" });
                var u = new SpeechSynthesisUtterance(txt);
                u.lang = voice ? voice.lang : "es-ES"; if (voice) u.voice = voice; u.rate = rate;
                var my = gen;
                u.onend = u.onerror = function () { if (playing && my === gen) next(); };
                synth.speak(u);
            }
            /* Modo MP3: un <audio> real sigue sonando con la pantalla apagada (la voz del navegador no). */
            var audio = new Audio(); audio.preload = "none";
            var aMode = false, aDuda = null, aBlocks = [], aTimes = [], playlist = [], pi = 0;
            function titleOf(d) { return d.querySelector("summary").textContent.replace(/\s+/g, " ").trim(); }
            function showPlayer(d) {
                document.getElementById("pNow").textContent = "🔊 " + titleOf(d);
                setPP(); player.classList.add("show"); document.body.classList.add("playing");
            }
            function mediaSession(d) {
                if (!("mediaSession" in navigator)) return;
                try {
                    navigator.mediaSession.metadata = new MediaMetadata({ title: titleOf(d), artist: "Mis Dudas · Charla Política de Adquisición" });
                    navigator.mediaSession.setActionHandler("play", function () { if (paused) togglePP(); });
                    navigator.mediaSession.setActionHandler("pause", function () { if (!paused) togglePP(); });
                    navigator.mediaSession.setActionHandler("nexttrack", function () { if (pi + 1 < playlist.length) playAt(pi + 1); });
                    navigator.mediaSession.setActionHandler("previoustrack", function () { if (pi > 0) playAt(pi - 1); else audio.currentTime = 0; });
                    navigator.mediaSession.setActionHandler("stop", stop);
                } catch (e) {}
            }
            function playAt(i) {
                var d = playlist[i]; pi = i;
                if (!hasAudio(d)) { if (!hasTTS) { if (i + 1 < playlist.length) playAt(i + 1); else stop(); return; } aMode = false; startTTS(d); return; }
                gen++; synth.cancel(); clearHi();
                aMode = true; aDuda = d; d.open = true; paused = false; playing = true;
                var a = AUD[numOf(d)];
                aBlocks = blocksOf(d); aTimes = a.t;
                audio.src = a.src; audio.playbackRate = rate;
                audio.play().catch(function () { paused = true; setPP(); });
                showPlayer(d); mediaSession(d);
            }
            audio.addEventListener("timeupdate", function () {
                if (!aMode) return;
                var t = audio.currentTime, k = 0;
                for (var i = 0; i < aTimes.length; i++) if (aTimes[i] <= t + 0.15) k = i;
                var el = aBlocks[k];
                if (el && el !== curEl) {
                    clearHi(); curEl = el; el.classList.add("tts-on");
                    if (document.visibilityState === "visible") {
                        var r = el.getBoundingClientRect();
                        if (r.top < 90 || r.bottom > window.innerHeight - 110) el.scrollIntoView({ behavior: "smooth", block: "center" });
                    }
                }
            });
            audio.addEventListener("ended", function () { if (pi + 1 < playlist.length) playAt(pi + 1); else stop(); });

            function startTTS(d) {
                gen++; synth.cancel(); said = {};
                d.open = true;
                queue = blocksOf(d); qi = 0; playing = true; paused = false;
                showPlayer(d);
                next();
            }
            function start(d) { playlist = [d]; playAt(0); }
            function stop() {
                gen++; playing = false; paused = false; synth.cancel(); clearHi();
                audio.pause(); aMode = false; playlist = [];
                player.classList.remove("show"); document.body.classList.remove("playing");
                if ("mediaSession" in navigator) try { navigator.mediaSession.metadata = null; } catch (e) {}
            }
            function togglePP() {
                if (aMode) {
                    if (paused) { paused = false; audio.play(); } else { paused = true; audio.pause(); }
                    setPP(); return;
                }
                if (paused) { paused = false; playing = true; qi = curIdx; setPP(); next(); }
                else { paused = true; playing = false; gen++; synth.cancel(); setPP(); if (curEl) curEl.classList.add("tts-on"); }
            }
            // Al terminar una duda en voz del navegador, seguir con la siguiente de la lista
            var _stopTTS = next;
            next = function () {
                if (!aMode && playing && qi >= queue.length && pi + 1 < playlist.length) { clearHi(); playAt(pi + 1); return; }
                _stopTTS();
            };
            document.getElementById("pStop").addEventListener("click", stop);
            document.getElementById("pPP").addEventListener("click", togglePP);
            document.getElementById("pRate").addEventListener("change", function () {
                rate = +this.value; audio.playbackRate = rate;
                try { localStorage.setItem("gr_charlapf_dudas_rate", rate); } catch (e) {}
            });

            var all = document.createElement("button");
            all.type = "button"; all.className = "tts-btn"; all.textContent = "🎧 Escuchar todas";
            all.setAttribute("aria-label", "Escuchar todas las dudas seguidas");
            all.addEventListener("click", function () {
                playlist = items.filter(function (d) { return d.style.display !== "none" && (hasAudio(d) || hasTTS); });
                if (playlist.length) playAt(0);
            });
            if (items.length) search.parentNode.insertBefore(all, search);

            items.forEach(function (d) {
                var ans = d.querySelector(".ans"); if (!ans) return;
                if (!hasAudio(d) && !hasTTS) return;
                var b = document.createElement("button");
                b.type = "button"; b.className = "tts-btn"; b.textContent = "🔊 Escuchar";
                b.setAttribute("aria-label", "Escuchar esta duda");
                b.addEventListener("click", function () { start(d); });
                ans.insertBefore(b, ans.firstChild);
            });
            window.addEventListener("pagehide", function () { synth.cancel(); });
        })();
    </script>
</body>
</html>
