<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | Gerencia de Recursos de TIC</title>
    <style>
        /* Estilos Base */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
            color: #000000;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        .container {
            text-align: center;
            max-width: 450px;
            width: 85%;
            padding: 40px 0;
        }

        h1 {
            font-weight: 200;
            letter-spacing: 4px;
            margin-bottom: 60px;
            text-transform: uppercase;
            font-size: 1.5rem;
        }

        /* Navegación y Botones */
        .menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            text-decoration: none;
            color: #000000;
            border: 1px solid #000000;
            padding: 18px 20px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-transform: uppercase;
        }

        /* Estados de interacción */
        .btn:hover {
            background-color: #000000;
            color: #ffffff;
        }

        /* Separador visual opcional para documentos */
        .separator {
            margin: 10px 0;
            height: 1px;
            background-color: #eeeeee;
        }

        /* MODO OSCURO */
        body { transition: background-color 0.3s ease, color 0.3s ease; }
        html[data-theme="dark"] { color-scheme: dark; }
        html[data-theme="dark"] body { background-color: #0e0e0e; color: #f2f2f2; }
        html[data-theme="dark"] .btn { color: #f2f2f2; border-color: #f2f2f2; }
        html[data-theme="dark"] .btn:hover { background-color: #f2f2f2; color: #0e0e0e; }
        html[data-theme="dark"] .separator { background-color: #2a2a2a; }

        .theme-toggle {
            position: fixed;
            top: calc(16px + env(safe-area-inset-top, 0px));
            right: 16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid currentColor;
            background: transparent;
            color: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            -webkit-tap-highlight-color: transparent;
        }
        @media (hover: hover) {
            .theme-toggle:hover { background-color: #000000; color: #ffffff; border-color: #000000; }
            html[data-theme="dark"] .theme-toggle:hover { background-color: #f2f2f2; color: #0e0e0e; border-color: #f2f2f2; }
        }
        .theme-toggle svg { width: 20px; height: 20px; }
        .theme-toggle .i-sun { display: none; }
        html[data-theme="dark"] .theme-toggle .i-sun { display: block; }
        html[data-theme="dark"] .theme-toggle .i-moon { display: none; }
    </style>
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem("theme"); } catch (e) {}
            if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", t);
        })();
    </script>
</head>
<body>

    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar a modo oscuro" title="Modo oscuro / claro">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>


    <div class="container">
        <h1>Gerencia de Recursos de TIC</h1>
        
        <nav class="menu">
            <a href="parcial1/index.html" class="btn">Parcial 1</a>
        </nav>
    </div>


    <script>
        (function () {
            var root = document.documentElement, btn = document.getElementById("themeToggle");
            function label() {
                btn.setAttribute("aria-label", root.getAttribute("data-theme") === "dark" ? "Cambiar a modo claro" : "Cambiar a modo oscuro");
            }
            label();
            btn.addEventListener("click", function () {
                var t = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
                root.setAttribute("data-theme", t);
                try { localStorage.setItem("theme", t); } catch (e) {}
                label();
            });
        })();
    </script>

</body>
</html>
