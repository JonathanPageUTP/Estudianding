<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flashcards · Principios de Economía</title>
<style>
  :root{
    --bg:#121212;
    --surface:#1c1c22;
    --surface-2:#232329;
    --text:#e2e8f0;
    --text-muted:#8b93a1;
    --emerald:#34d399;
    --blue:#38bdf8;
    --line:#2c2c34;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  body{
    display:flex; flex-direction:column;
    min-height:100vh;
    min-height:100dvh;
    overflow:hidden;
  }

  /* ---------- HEADER ---------- */
  header{
    flex:0 0 auto;
    padding:0.9rem 1rem 0.7rem;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:0.6rem;
  }
  .brand h1{
    font-size:0.95rem;
    font-weight:700;
    letter-spacing:0.02em;
    margin:0;
    color:var(--text);
  }
  .brand h1 span{ color:var(--emerald); }
  .counter{
    font-size:0.8rem;
    color:var(--text-muted);
    font-variant-numeric:tabular-nums;
  }
  .progress-track{
    width:100%; height:4px;
    background:var(--surface-2);
    border-radius:4px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--emerald), var(--blue));
    border-radius:4px;
    transition:width 0.25s ease;
  }
  .category-tag{
    display:inline-block;
    margin-top:0.55rem;
    font-size:0.68rem;
    font-weight:600;
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:0.22rem 0.6rem;
    border-radius:999px;
    background:var(--surface-2);
    border:1px solid var(--cat-color, var(--emerald));
    color:var(--cat-color, var(--emerald));
  }
  .status-dot{
    display:inline-block;
    width:0.55rem;
    height:0.55rem;
    border-radius:50%;
    margin-left:0.45rem;
    background:var(--text-muted);
    opacity:0.5;
    vertical-align:middle;
  }
  .status-dot.is-learned{ background:var(--emerald); opacity:1; }
  .status-dot.is-review{ background:#fbbf24; opacity:1; }

  .flashcard.status-learned .face{ border-color: var(--emerald); }
  .flashcard.status-review .face{ border-color: #fbbf24; }

  .filters-row{
    display:flex;
    gap:0.5rem;
    margin-top:0.6rem;
  }
  @media (max-width: 768px) {
  .filters-row {
    flex-direction: column; /* Cambia de fila a columna */
    width: 100%;            /* Se asegura de usar todo el ancho */
    gap: 0.8rem;            /* Un poquito más de espacio vertical para el dedo */
  }
}
  .filter-select{
    flex:1;
    appearance:none;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    font-size:0.78rem;
    font-weight:600;
    padding:0.5rem 0.6rem;
    border-radius:0.6rem;
    cursor:pointer;
  }
  .filter-select:focus{ outline:2px solid var(--emerald); outline-offset:1px; }

  /* ---------- MAIN / CARD ---------- */
  main{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:1.1rem;
    min-height:0;
    overflow:hidden;
  }
  .scene{
    width:100%;
    max-width:34rem;
    height:100%;
    max-height:26rem;
    perspective:1600px;
  }
  .flashcard{
    position:relative;
    width:100%;
    height:100%;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform 0.55s cubic-bezier(.4,.2,.2,1);
  }
  .flashcard.flipped{
    transform:rotateY(180deg);
  }
  .face{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:1.1rem;
    padding:1.6rem 1.5rem;
    background:var(--surface);
    border:1px solid var(--line);
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
  }
  .face .eyebrow{
    font-size:0.72rem;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-bottom:0.9rem;
  }
  .face.front .eyebrow{ color:var(--emerald); }
  .face.back .eyebrow{ color:var(--blue); }
  .face .content{
    font-size:1.18rem;
    line-height:1.5;
    overflow-y:auto;
    max-height:100%;
    padding-right:0.2rem;
  }
  .face.front .content{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:600;
    font-size:1.28rem;
  }
  .face .hint{
    position:absolute;
    bottom:0.9rem;
    left:0;
    right:0;
    text-align:center;
    font-size:0.72rem;
    color:var(--text-muted);
  }
  .face.back{
    transform:rotateY(180deg);
    border-top:3px solid var(--blue);
  }
  .face.front{
    border-top:3px solid var(--emerald);
  }

  /* ---------- FOOTER / NAV ---------- */
  footer{
    flex:0 0 auto;
    display:flex;
    gap:0.6rem;
    padding:0.8rem 1rem calc(0.9rem + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    background:var(--bg);
  }
  .nav-btn{
    flex:1;
    border:none;
    border-radius:0.9rem;
    padding:0.95rem 0.4rem;
    font-size:0.95rem;
    font-weight:700;
    background:var(--surface-2);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.35rem;
    transition:transform 0.12s ease, opacity 0.12s ease;
  }
  .nav-btn:active{ transform:scale(0.95); }
  .nav-btn:disabled{ opacity:0.35; }
  .nav-btn.flip{
    flex:1.3;
    background:linear-gradient(135deg, var(--emerald), var(--blue));
    color:#0a0a0a;
  }
  .nav-btn svg{ width:1.1rem; height:1.1rem; flex:0 0 auto; }

   /* ---------- ESTADO DE APRENDIZAJE ---------- */
  .status-row{
    flex:0 0 auto;
    display:flex;
    gap:0.6rem;
    padding:0 1rem 0.6rem;
  }
  .status-btn{
    flex:1;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--text);
    font-size:0.85rem;
    font-weight:700;
    padding:0.65rem 0.4rem;
    border-radius:0.8rem;
    cursor:pointer;
    transition:transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .status-btn:active{ transform:scale(0.96); }
  .status-btn:disabled{ opacity:0.35; cursor:default; }
  .status-btn.learned.active{ background:rgba(52,211,153,0.18); border-color:var(--emerald); color:var(--emerald); }
  .status-btn.review.active{ background:rgba(251,191,36,0.18); border-color:#fbbf24; color:#fbbf24; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Principios de <span>Economía</span></h1>
    <div class="counter" id="counter">Tarjeta 1 de 100</div>
  </div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <span class="category-tag" id="categoryTag">Ciclo Económico</span><span class="status-dot" id="statusDot" title="Estado de la tarjeta"></span>
  <div class="filters-row">
    <select id="catFilter" class="filter-select">
      <option value="all">Todos los temas</option>
      <!-- Las opciones se generan automáticamente con JS desde CATS -->
    </select>
    <select id="statusFilter" class="filter-select">
      <option value="all">Todas</option>
      <option value="learned">Solo aprendidas</option>
      <option value="review">Por repasar</option>
    </select>
  </div>
</header>
<main>
  <div class="scene">
    <div class="flashcard" id="flashcard">
      <div class="face front">
        <div class="eyebrow">Pregunta</div>
        <div class="content" id="frontContent"></div>
        <div class="hint">Toca la tarjeta para ver la respuesta</div>
      </div>
      <div class="face back">
        <div class="eyebrow">Respuesta</div>
        <div class="content" id="backContent"></div>
        <div class="hint">Toca de nuevo para volver</div>
      </div>
    </div>
  </div>
</main>

<div class="status-row" id="statusRow">
  <button class="status-btn learned" id="markLearnedBtn">✓ Aprendida</button>
  <button class="status-btn review" id="markReviewBtn">↻ Falta repasar</button>
</div>

<footer>
  <button class="nav-btn" id="prevBtn" aria-label="Anterior">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    Anterior
  </button>
  <button class="nav-btn flip" id="flipBtn" aria-label="Voltear tarjeta">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.1l4 4-4 4"/><path d="M3 12.6v-2a4 4 0 014-4h14"/><path d="M7 21.9l-4-4 4-4"/><path d="M21 11.4v2a4 4 0 01-4 4H3"/></svg>
    Voltear
  </button>
  <button class="nav-btn" id="nextBtn" aria-label="Siguiente">
    Siguiente
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</footer>

<script>
// ---------- CATEGORY META ----------
const CATS = [
  { name: "Ciclo Económico", color: "#34d399" },
  { name: "Comercio Internacional y Balanza de Pagos", color: "#38bdf8" },
  { name: "Indicadores Macroeconómicos", color: "#fbbf24" },
  { name: "Crecimiento y Desarrollo Económico", color: "#a78bfa" },
  { name: "Tipos de Cambio y Mercado de Divisas", color: "#fb7185" }
];

// ---------- DATA: 100 FLASHCARDS ----------
// cat index: 0 Ciclo Económico | 1 Comercio Internacional/Balanza de Pagos
// 2 Indicadores Macroeconómicos | 3 Crecimiento y Desarrollo | 4 Tipos de Cambio/Divisas
const CARDS = [
// ===== 1. CICLO ECONÓMICO (1-20) =====
{c:0,q:"¿Qué es el Ciclo Económico?",a:"Es la secuencia de fluctuaciones en la actividad económica de un país, compuesta por 4 fases: Punto Inferior (Valle o Depresión), Expansión (Recuperación o Crecimiento), Punto Superior (Pico o Auge) y Recesión."},
{c:0,q:"Nombra las 4 fases del ciclo económico en orden.",a:"1) Punto Inferior (Valle/Depresión), 2) Expansión (Recuperación/Crecimiento), 3) Punto Superior (Pico/Auge), 4) Recesión."},
{c:0,q:"¿Qué es la Depresión (Fase 1)?",a:"Es el punto más bajo de la actividad económica antes de que comience la recuperación."},
{c:0,q:"En la Depresión, ¿cómo están el desempleo y la producción?",a:"El desempleo está en su punto más alto y la producción está en su nivel más bajo."},
{c:0,q:"En la Depresión, ¿cómo están los precios y la confianza?",a:"Los precios pueden ser bajos (deflación o baja inflación) y la confianza es muy baja, pero se estabiliza."},
{c:0,q:"¿Qué es la Expansión o Recuperación (Fase 2)?",a:"Es el período de crecimiento económico sostenido."},
{c:0,q:"En la Expansión, ¿qué sucede con el PIB y el desempleo?",a:"Aumenta el PIB y se reduce el desempleo."},
{c:0,q:"En la Expansión, ¿qué sucede con la producción y la inversión?",a:"Aumenta la producción industrial, las ventas y la inversión empresarial."},
{c:0,q:"En la Expansión, ¿qué sucede con la confianza y la inflación?",a:"Mejora la confianza del consumidor y de las empresas; puede aumentar la inflación a medida que crece la demanda."},
{c:0,q:"¿Qué representa la Fase 3, Punto Superior o Pico?",a:"Es el punto más alto de actividad económica del ciclo, ubicado entre la Expansión y la Recesión."},
{c:0,q:"¿Qué es la Recesión (Fase 4)?",a:"Es el período de contracción económica significativa."},
{c:0,q:"¿Cuál es la regla del PIB para hablar de Recesión?",a:"Una disminución del Producto Interno Bruto (PIB) durante al menos dos trimestres consecutivos."},
{c:0,q:"En la Recesión, ¿qué sucede con el desempleo, la producción y las ventas?",a:"Aumenta el desempleo y cae la producción industrial y las ventas minoristas."},
{c:0,q:"En la Recesión, ¿qué sucede con la inversión y la confianza?",a:"Disminuye la inversión empresarial y baja la confianza del consumidor y de las empresas."},
{c:0,q:"¿Cuáles son las causas más comunes de una Recesión?",a:"Estallido de burbujas económicas, crisis financieras, shocks externos (pandemias, guerras) y políticas monetarias o fiscales restrictivas."},
{c:0,q:"¿Cuál es el impacto de una Recesión?",a:"Reducción de ingresos y mayor incertidumbre."},
{c:0,q:"¿Qué es la Política Monetaria como factor del ciclo económico?",a:"El manejo de tasas de interés y oferta monetaria por parte de los Bancos Centrales."},
{c:0,q:"¿Qué es la Política Fiscal como factor del ciclo económico?",a:"El gasto público y los impuestos gestionados por los Gobiernos."},
{c:0,q:"¿Cómo influyen la Confianza y la Innovación en el ciclo económico?",a:"La confianza de consumidores y empresas (expectativas sobre el futuro) y la innovación/tecnología (nuevas industrias, más productividad) influyen en el ciclo."},
{c:0,q:"¿Cómo influyen los Eventos Externos y los Cambios Demográficos en el ciclo económico?",a:"Los eventos externos (crisis globales, precios del petróleo, desastres naturales) y los cambios demográficos (crecimiento poblacional, envejecimiento) también afectan el ciclo."},

// ===== 2. COMERCIO INTERNACIONAL Y BALANZA DE PAGOS (21-44) =====
{c:1,q:"¿Qué es el Comercio Internacional?",a:"Es el intercambio de bienes, servicios y capitales a través de las fronteras nacionales, y es el motor que impulsa la interconexión entre países."},
{c:1,q:"¿Qué beneficio central obtienen los países del Comercio Internacional?",a:"Permite que las naciones se beneficien de la especialización y de las ventajas comparativas."},
{c:1,q:"¿Qué es la Ventaja Comparativa?",a:"Un país tiene ventaja comparativa en un bien si puede producirlo a un costo de oportunidad más bajo que otro país."},
{c:1,q:"¿La ventaja comparativa significa ser el productor más eficiente?",a:"No; significa que el país sacrifica menos de otros bienes para producirlo, no que sea el más eficiente en términos absolutos."},
{c:1,q:"¿Qué son las Economías de Escala en el comercio internacional?",a:"Al producir para un mercado global, las empresas aumentan su volumen de producción y reducen sus costos unitarios."},
{c:1,q:"¿Qué aporta la Diversidad de Productos y Consumo?",a:"Permite a los consumidores acceder a mayor variedad de bienes y servicios que no se producen localmente, mejorando su bienestar."},
{c:1,q:"¿Qué facilita la Transferencia de Tecnología y Conocimiento?",a:"La difusión de nuevas tecnologías, ideas y métodos de producción entre países, fomentando la innovación."},
{c:1,q:"¿Qué son los Aranceles?",a:"Impuestos aplicados a bienes importados; protegen la industria nacional pero encarecen los productos para el consumidor."},
{c:1,q:"¿Qué son las Cuotas de Importación?",a:"Límites a la cantidad de un bien que puede importarse en un período determinado."},
{c:1,q:"¿Qué son los Subsidios a la Exportación?",a:"Pagos o incentivos a productores nacionales para que vendan sus bienes en el extranjero a precios más competitivos."},
{c:1,q:"¿Qué son las Barreras No Arancelarias?",a:"Regulaciones técnicas, sanitarias o de seguridad que, aunque justificadas, pueden actuar como obstáculos al comercio."},
{c:1,q:"¿Qué es un Tratado de Libre Comercio (TLC)?",a:"Un acuerdo entre dos o más países para reducir o eliminar barreras al comercio entre ellos, promoviendo un mayor intercambio."},
{c:1,q:"¿Qué es la Balanza de Pagos?",a:"Un registro contable sistemático de todas las transacciones económicas entre los residentes de un país y los del resto del mundo, en un período determinado (generalmente un año)."},
{c:1,q:"¿Cuáles son las 3 cuentas principales de la Balanza de Pagos?",a:"Cuenta Corriente, Cuenta de Capital y Cuenta Financiera."},
{c:1,q:"¿Qué registra la Cuenta Corriente?",a:"El flujo de bienes, servicios, ingresos y transferencias unilaterales."},
{c:1,q:"¿Qué es la Balanza Comercial y cuándo hay superávit o déficit?",a:"Registra exportaciones e importaciones de mercancías tangibles; hay superávit comercial si se exporta más de lo que se importa, y déficit si se importa más de lo que se exporta."},
{c:1,q:"¿Qué es la Balanza de Servicios?",a:"Registra exportaciones e importaciones de servicios (turismo, transporte, seguros, servicios financieros, servicios del Canal de Panamá)."},
{c:1,q:"¿Qué es la Balanza de Rentas (Ingresos Primarios)?",a:"Ingresos y pagos derivados del capital y el trabajo, como salarios, intereses de inversiones y dividendos."},
{c:1,q:"¿Qué es la Balanza de Transferencias Corrientes (Ingresos Secundarios)?",a:"Transferencias sin contrapartida, como remesas de trabajadores, donaciones y ayuda internacional."},
{c:1,q:"¿Qué registra la Cuenta de Capital?",a:"Las transferencias de capital no productivas y la adquisición/disposición de activos no financieros no producidos (como patentes y marcas); suele agruparse con la cuenta corriente en análisis simplificados."},
{c:1,q:"¿Qué registra la Cuenta Financiera?",a:"Las transacciones de activos y pasivos financieros, es decir, las inversiones."},
{c:1,q:"¿Qué es el Principio de Doble Entrada en la Balanza de Pagos?",a:"Cada transacción se registra dos veces, una como crédito y otra como débito, por lo que la Balanza de Pagos siempre está, por definición, en equilibrio contable."},
{c:1,q:"Si la Cuenta Corriente tiene déficit, ¿cómo se financia?",a:"Debe financiarse con un superávit en la Cuenta Financiera: el país recibe más inversión extranjera o préstamos del exterior."},
{c:1,q:"Si la Cuenta Corriente tiene superávit, ¿qué implica para la Cuenta Financiera?",a:"Se traduce en un déficit en la Cuenta Financiera: el país invierte más en el extranjero o acumula reservas internacionales."},

// ===== 3. INDICADORES MACROECONÓMICOS (45-63) =====
{c:2,q:"¿Qué son los indicadores macroeconómicos?",a:"Datos estadísticos que muestran la salud de un país de acuerdo a ciertas áreas de la economía."},
{c:2,q:"¿Para qué se usan los indicadores macroeconómicos?",a:"Los gobiernos los utilizan para conocer la salud actual y futura de un país, sector o región."},
{c:2,q:"¿Qué es el PIB?",a:"El principal indicador macroeconómico; expresa el valor de todos los bienes y servicios finales producidos en un país durante un período (generalmente un año), incluyendo los factores de producción propiedad de ciudadanos y extranjeros."},
{c:2,q:"¿Qué mide el Índice de Precios al Consumo (IPC)?",a:"Mide los cambios en los precios de los productos de una cesta de la compra, informando sobre la posibilidad de inflación."},
{c:2,q:"¿Qué revela el Índice de Precios de Producción (IPP)?",a:"El resultado de la investigación del precio de los bienes a nivel mayorista, mostrando la evolución de los beneficios que obtienen los productores."},
{c:2,q:"¿Para qué ayuda la Tasa de Desempleo?",a:"Ayuda a prevenir procesos inflacionistas y a conocer la realidad que afecta a la población en edad de trabajar."},
{c:2,q:"¿Qué informa el Índice de Ventas Minoristas?",a:"El estado de las ventas realizadas en ese sector para un período de un mes."},
{c:2,q:"¿Qué revela el Índice de Confianza del Consumidor?",a:"El sentimiento de los consumidores hacia su potencial de gasto y el estado general de la economía en su región."},
{c:2,q:"¿Qué es el Índice de Mortalidad?",a:"Refleja la cantidad de defunciones por cada mil ciudadanos en un período determinado (generalmente 12 meses); también se le llama tasa bruta de mortalidad."},
{c:2,q:"¿Qué estudia la Economía Agrícola?",a:"Todo lo relacionado con las actividades agrícolas: producción, comercialización, precios, entre otros."},
{c:2,q:"¿Qué abarca la Economía Industrial?",a:"Desde la teoría de la localización industrial hasta la producción y comercialización de productos industriales."},
{c:2,q:"¿Qué estudia la Economía Nacional?",a:"Los agregados macroeconómicos, como las cuentas nacionales, contabilidad nacional, producción nacional e ingreso nacional."},
{c:2,q:"¿Qué estudia la Economía Internacional?",a:"Las transacciones económicas de un país con el exterior."},
{c:2,q:"¿Qué abarca la Economía Laboral?",a:"Todo lo relacionado con el trabajo, como el desempleo y el subempleo."},
{c:2,q:"¿Qué aborda la Economía Social?",a:"Los fenómenos económicos que inciden en el bienestar de la sociedad, como la educación y la vivienda."},
{c:2,q:"¿Qué es la Economía Política?",a:"La ciencia que estudia las leyes de la producción, distribución y consumo de los bienes y servicios que satisfacen necesidades."},
{c:2,q:"¿Qué es la Política Económica?",a:"La parte de la ciencia económica que estudia las formas y efectos de la intervención del Estado en la vida económica."},
{c:2,q:"¿Cuál es el objetivo de la intervención del Estado mediante la Política Económica?",a:"Lograr el desarrollo económico sustentable del país y mejores niveles de vida para toda la población."},
{c:2,q:"¿Cuál es la diferencia entre Economía Política y Política Económica?",a:"La Economía Política descubre las leyes económicas que explican la realidad económica; la Política Económica aplica esas leyes económicas para obtener determinados objetivos."},

// ===== 4. CRECIMIENTO Y DESARROLLO ECONÓMICO (64-78) =====
{c:3,q:"¿Qué es el Crecimiento Económico?",a:"Es el incremento de la cantidad de bienes y servicios producidos por una economía en un período de tiempo."},
{c:3,q:"¿Qué implica un crecimiento económico positivo?",a:"Un aumento en la productividad de los factores de producción y en la capacidad de la economía para producir bienes y servicios."},
{c:3,q:"¿Cómo se puede interpretar el crecimiento económico respecto a las políticas?",a:"Como una medida del éxito de las políticas económicas; un elevado crecimiento sería un resultado deseado por las autoridades y por la población."},
{c:3,q:"Nombra las 4 principales fuentes de crecimiento económico.",a:"Recursos Humanos, Formación de Capital, Cambio tecnológico e innovación, y Recursos Naturales."},
{c:3,q:"¿Qué es el Desarrollo Económico?",a:"Tiene que ver con que la población pueda acceder a servicios de calidad en educación, salud, vivienda, entretenimiento y esparcimiento, y cubrir necesidades básicas como alimentación y vestido; implica bienestar social."},
{c:3,q:"¿Por qué es importante el Desarrollo Económico?",a:"Radica en la estabilidad del entorno: disminuye la delincuencia, las protestas sociales y la inmigración, y dota de calidad de vida a la población, generando condiciones para la felicidad social."},
{c:3,q:"Menciona algunos aspectos con los que se mide el Desarrollo Económico.",a:"Esperanza de vida, porcentaje de viviendas con electricidad, acceso a agua potable, teléfonos por cada 1000 habitantes, tasa de mortalidad, promedio de años de estudio, acceso a internet e ingreso per cápita."},
{c:3,q:"¿Qué bases permiten lograr el Desarrollo Económico?",a:"La tecnología, la educación y la investigación, ya que incrementan la productividad y el ingreso per cápita."},
{c:3,q:"Además de tecnología y educación, ¿qué más contribuye al Desarrollo Económico?",a:"Las políticas públicas incluyentes que repartan igualitariamente la riqueza, construyan bienes públicos para todos y mejoren los sistemas educativos, de vivienda y salud."},
{c:3,q:"¿Qué es el Desarrollo Sostenible?",a:"Es capaz de satisfacer las necesidades actuales sin comprometer los recursos y posibilidades de las futuras generaciones; una actividad sostenible es aquella que se puede conservar."},
{c:3,q:"Da un ejemplo de actividad sostenible mencionado en el material.",a:"Cortar árboles de un bosque asegurando la repoblación."},
{c:3,q:"¿Por qué es importante el Desarrollo Sostenible?",a:"Vela por el mejoramiento de la calidad de vida en toda actividad humana, utilizando solamente lo necesario de los recursos naturales."},
{c:3,q:"Menciona 3 características del Desarrollo Sostenible (parte 1).",a:"Promueve la autosuficiencia regional, reconoce la importancia de la naturaleza para el bienestar humano, y asegura que la actividad económica mejore la calidad de vida de todos, no solo de unos pocos."},
{c:3,q:"Menciona otras características del Desarrollo Sostenible (parte 2).",a:"Usa los recursos eficientemente, promueve el máximo de reciclaje y reutilización, y busca que la actividad económica mantenga o mejore el sistema ambiental."},
{c:3,q:"Menciona las últimas características del Desarrollo Sostenible (parte 3).",a:"Pone su confianza en el desarrollo e implantación de tecnologías limpias, y restaura los ecosistemas dañados."},

// ===== 5. TIPOS DE CAMBIO Y MERCADO DE DIVISAS (79-100) =====
{c:4,q:"¿Por qué son importantes las divisas y los tipos de cambio?",a:"Son el corazón de la economía global: permiten comprar y vender bienes y servicios entre países, invertir más allá de las fronteras y entender cómo se conecta el mundo financieramente."},
{c:4,q:"¿Qué es una Divisa?",a:"Es la moneda de un país extranjero, como el Dólar estadounidense (USD), el Euro (EUR) o el Yen japonés (JPY)."},
{c:4,q:"¿Para qué son esenciales las divisas?",a:"Para el comercio internacional, la inversión y el turismo."},
{c:4,q:"¿Por qué mantienen los países reservas de divisas?",a:"Para poder realizar pagos internacionales y estabilizar su propia moneda; suelen mantenerlas principalmente en monedas fuertes y estables."},
{c:4,q:"¿Qué es el Tipo de Cambio?",a:"Es, simplemente, el precio de una moneda en términos de otra."},
{c:4,q:"Si el EUR/USD es 1.08, ¿qué significa?",a:"Que 1 Euro equivale a 1.08 Dólares estadounidenses."},
{c:4,q:"¿Qué significa que una moneda se aprecie?",a:"Que su valor aumenta en relación con otra; por ejemplo, si el EUR/USD pasa de 1.08 a 1.10, el Euro se ha apreciado."},
{c:4,q:"¿Qué significa que una moneda se deprecie?",a:"Que su valor disminuye; por ejemplo, si el EUR/USD baja de 1.08 a 1.05, el Euro se ha depreciado."},
{c:4,q:"¿Cómo afectan las Tasas de Interés al tipo de cambio?",a:"Si un país sube sus tasas de interés, atrae a inversores extranjeros que buscan mayores rendimientos, lo que aumenta la demanda de su moneda y la aprecia."},
{c:4,q:"¿Cómo afecta un superávit comercial al tipo de cambio?",a:"Un superávit comercial (exportaciones mayores que importaciones) significa que entran más divisas al país, lo que tiende a apreciar la moneda."},
{c:4,q:"¿Cómo afecta un déficit comercial al tipo de cambio?",a:"Un déficit comercial (importaciones mayores que exportaciones) implica una salida de divisas, lo que tiende a depreciar la moneda."},
{c:4,q:"¿Cómo afecta la Inflación al tipo de cambio?",a:"Los países con alta inflación suelen ver su moneda depreciarse porque su poder adquisitivo disminuye internamente."},
{c:4,q:"¿Cómo afecta la Estabilidad Política y Económica al tipo de cambio?",a:"La incertidumbre política o económica puede asustar a los inversores, provocando una fuga de capitales y la depreciación de la moneda."},
{c:4,q:"¿Cómo afecta la Especulación al tipo de cambio?",a:"Grandes volúmenes de capital se mueven diariamente según las expectativas de los inversores sobre futuros movimientos, lo que puede generar o amplificar movimientos en el tipo de cambio."},
{c:4,q:"¿Qué es el Mercado de Divisas (Forex)?",a:"Es el mercado donde se intercambian las divisas (Foreign Exchange Market)."},
{c:4,q:"¿Qué tan grande y líquido es el mercado Forex?",a:"Es el mercado financiero más grande y líquido del mundo, con transacciones que superan los 7 billones de dólares diarios."},
{c:4,q:"¿Cuál es el horario de operación del Forex?",a:"Opera las 24 horas del día, de lunes a viernes, a través de una red global."},
{c:4,q:"¿Qué papel juegan los Bancos Comerciales en el Forex?",a:"Son los participantes más grandes; realizan transacciones para ellos mismos y para sus clientes."},
{c:4,q:"¿Qué papel juegan las Corporaciones Multinacionales en el Forex?",a:"Necesitan divisas para sus operaciones globales."},
{c:4,q:"¿Qué papel juegan los Bancos Centrales en el Forex?",a:"Intervienen para influir en el tipo de cambio de su propia moneda."},
{c:4,q:"¿Qué papel juegan los Fondos de Inversión y Especuladores en el Forex?",a:"Buscan ganancias con los movimientos de las divisas."},
{c:4,q:"Menciona los 4 principales participantes del mercado Forex.",a:"Bancos comerciales, corporaciones multinacionales, bancos centrales, y fondos de inversión y especuladores."}
];

// ---------- STATE ----------
let flipped = false;
let filterCat = 'all';     // 'all' o el índice de categoría (0-4)
let filterStatus = 'all';  // 'all' | 'learned' | 'review'
let visible = [];          // índices de CARDS que cumplen los filtros actuales
let pos = 0;                // posición actual dentro de "visible"

// ---------- DOM ----------
const flashcard = document.getElementById('flashcard');
const frontContent = document.getElementById('frontContent');
const backContent = document.getElementById('backContent');
const counter = document.getElementById('counter');
const categoryTag = document.getElementById('categoryTag');
const progressFill = document.getElementById('progressFill');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const flipBtn = document.getElementById('flipBtn');
const catFilter = document.getElementById('catFilter');
const statusFilter = document.getElementById('statusFilter');
const statusDot = document.getElementById('statusDot');
const markLearnedBtn = document.getElementById('markLearnedBtn');
const markReviewBtn = document.getElementById('markReviewBtn');

// Rellenar el <select> de temas con las categorías definidas en CATS
CATS.forEach((cat, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = cat.name;
  catFilter.appendChild(opt);
});

function render(){
  if(flipped){
    flashcard.classList.remove('flipped');
    flipped = false;
  }

  if(visible.length === 0){
    frontContent.textContent = 'No hay tarjetas con este filtro.';
    backContent.textContent = 'Prueba a cambiar el tema o el estado.';
    counter.textContent = `Tarjeta 0 de 0`;
    categoryTag.textContent = '—';
    categoryTag.style.setProperty('--cat-color', '#8b93a1');
    progressFill.style.width = '0%';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    statusDot.className = 'status-dot';
    flashcard.classList.remove('status-learned', 'status-review');
    markLearnedBtn.classList.remove('active');
    markReviewBtn.classList.remove('active');
    markLearnedBtn.disabled = true;
    markReviewBtn.disabled = true;
    return;
  }

  markLearnedBtn.disabled = false;
  markReviewBtn.disabled = false;

  const cardIndex = visible[pos];
  const card = CARDS[cardIndex];
  const cat = CATS[card.c];

  frontContent.textContent = card.q;
  backContent.textContent = card.a;
  counter.textContent = `Tarjeta ${pos+1} de ${visible.length}`;
  categoryTag.textContent = cat.name;
  categoryTag.style.setProperty('--cat-color', cat.color);
  progressFill.style.width = ((pos+1)/visible.length*100) + '%';
  prevBtn.disabled = (pos === 0);
  nextBtn.disabled = (pos === visible.length - 1);

  // Indicador visual + botones según el estado de aprendizaje guardado
  statusDot.className = 'status-dot' + (card.status ? ' is-' + card.status : '');
  flashcard.classList.remove('status-learned', 'status-review');
  if(card.status === 'learned') flashcard.classList.add('status-learned');
  if(card.status === 'review') flashcard.classList.add('status-review');
  markLearnedBtn.classList.toggle('active', card.status === 'learned');
  markReviewBtn.classList.toggle('active', card.status === 'review');
}

// Recalcula qué tarjetas cumplen los filtros activos
function applyFilters(){
  visible = CARDS
    .map((_, i) => i)
    .filter(i => {
      const card = CARDS[i];
      const matchesCat = (filterCat === 'all') || (card.c === Number(filterCat));
      const matchesStatus = (filterStatus === 'all') || (card.status === filterStatus);
      return matchesCat && matchesStatus;
    });
  pos = 0;
  render();
}

// Marca (o desmarca, si se pulsa dos veces) el estado de la tarjeta actual
function setStatus(newStatus){
  if(visible.length === 0) return;
  const card = CARDS[visible[pos]];
  card.status = (card.status === newStatus) ? null : newStatus;

  // Si el filtro de estado activo ya no incluye esta tarjeta, recalculamos la lista visible
  if(filterStatus !== 'all' && card.status !== filterStatus){
    applyFilters();
  } else {
    render();
  }
}

function goTo(newPos){
  if(newPos < 0 || newPos >= visible.length) return;
  pos = newPos;
  render();
}

function toggleFlip(){
  flipped = !flipped;
  flashcard.classList.toggle('flipped', flipped);
}

flashcard.addEventListener('click', toggleFlip);
flipBtn.addEventListener('click', toggleFlip);
prevBtn.addEventListener('click', () => goTo(pos - 1));
nextBtn.addEventListener('click', () => goTo(pos + 1));

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowLeft') goTo(pos - 1);
  else if(e.key === 'ArrowRight') goTo(pos + 1);
  else if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); toggleFlip(); }
});

markLearnedBtn.addEventListener('click', () => setStatus('learned'));
markReviewBtn.addEventListener('click', () => setStatus('review'));

catFilter.addEventListener('change', () => {
  filterCat = catFilter.value;
  applyFilters();
});
statusFilter.addEventListener('change', () => {
  filterStatus = statusFilter.value;
  applyFilters();
});

// Swipe support (mobile)
let touchStartX = null;
flashcard.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].clientX;
}, {passive:true});
flashcard.addEventListener('touchend', (e) => {
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 60){
    if(dx < 0) goTo(pos + 1);
    else goTo(pos - 1);
  }
  touchStartX = null;
}, {passive:true});

applyFilters();
</script>
</body>
