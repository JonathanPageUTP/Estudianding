    <style>
        /* Estilos Base */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
            color: #000000;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        .container {
            text-align: center;
            max-width: 450px;
            width: 85%;
            padding: 40px 0;
        }

        h1 {
            font-weight: 200;
            letter-spacing: 4px;
            margin-bottom: 60px;
            text-transform: uppercase;
            font-size: 1.5rem;
        }

        /* Navegación y Botones */
        .menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            text-decoration: none;
            color: #000000;
            border: 1px solid #000000;
            padding: 18px 20px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-transform: uppercase;
        }

        /* Estados de interacción */
        .btn:hover {
            background-color: #000000;
            color: #ffffff;
        }

        /* Separador visual opcional para documentos */
        .separator {
            margin: 10px 0;
            height: 1px;
            background-color: #eeeeee;
        }
    
        /* BOTONES DE NAVEGACIÓN (volver / inicio) */
        .navc { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; display: flex; gap: 8px; z-index: 10; }
        .navc a {
            width: 44px; height: 44px; border-radius: 50%; border: 1px solid currentColor;
            color: inherit; display: flex; align-items: center; justify-content: center; text-decoration: none;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); -webkit-tap-highlight-color: transparent;
        }
        .navc svg { width: 20px; height: 20px; }
        .container { padding-top: 84px; }
        @media (hover: hover) {
            .navc a:hover { background-color: #000000; color: #ffffff; border-color: #000000; }
            html[data-theme="dark"] .navc a:hover { background-color: #f2f2f2; color: #0e0e0e; border-color: #f2f2f2; }
        }
    </style>
</head>
