<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulacro · Vulnerabilidad en Dispositivos Perimetrales</title>
<style>
  :root{
    --bg: #0c1420;
    --bg-soft: #101c2c;
    --panel: #142238;
    --panel-border: #223756;
    --ink: #e7edf6;
    --ink-dim: #93a5c2;
    --accent: #34c3a6;      /* señal "permitido" */
    --accent-soft: rgba(52,195,166,.14);
    --alert: #ef5b6b;       /* señal "bloqueado" */
    --alert-soft: rgba(239,91,107,.14);
    --amber: #e8a83c;       /* zona neutra / DMZ */
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #17233a 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
    padding-bottom:110px;
    min-height:100vh;
  }

  /* ---------- Header / "consola de perímetro" ---------- */
  header.console{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg-soft) 0%, rgba(16,28,44,.92) 100%);
    border-bottom:1px solid var(--panel-border);
    backdrop-filter:blur(6px);
    padding:14px 18px 12px;
  }
  .console-top{
    display:flex; align-items:center; gap:10px; margin-bottom:10px;
  }
  .dot-row{display:flex; gap:5px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);}
  .dot:nth-child(2){background:var(--amber);box-shadow:0 0 6px var(--amber);}
  .dot:nth-child(3){background:var(--alert);box-shadow:0 0 6px var(--alert);}
  .console-title{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  h1{
    font-size:20px;
    margin:0 0 2px;
    font-weight:700;
    letter-spacing:-.01em;
  }
  .subtitle{
    font-size:12.5px;
    color:var(--ink-dim);
    margin:0 0 12px;
  }
  .gauge-wrap{
    display:flex; align-items:center; gap:10px;
  }
  .gauge-track{
    flex:1; height:8px; border-radius:6px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    overflow:hidden;
    position:relative;
  }
  .gauge-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, #1f8f7a, var(--accent));
    transition:width .35s ease;
    border-radius:6px;
  }
  .gauge-label{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--ink-dim);
    white-space:nowrap;
    min-width:64px;
    text-align:right;
  }

  /* ---------- Results banner ---------- */
  #resultsBanner{
    display:none;
    margin:14px 18px 0;
    border-radius:14px;
    padding:16px 18px;
    border:1px solid var(--panel-border);
    background:var(--panel);
  }
  #resultsBanner.show{display:block;}
  .score-big{
    font-family:var(--mono);
    font-size:34px;
    font-weight:700;
    line-height:1;
  }
  .score-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .score-tag{
    font-family:var(--mono); font-size:11px; letter-spacing:.08em;
    color:var(--ink-dim); text-transform:uppercase;
  }
  .verdict{
    margin-top:8px;
    font-size:13.5px;
    color:var(--ink-dim);
  }

  main{
    max-width:640px;
    margin:0 auto;
    padding:16px 18px 8px;
  }

  /* ---------- Question card ---------- */
  .qcard{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:16px 16px 14px;
    margin-bottom:14px;
    transition:border-color .2s ease;
  }
  .qcard.answered{border-color:#2a4162;}
  .qhead{
    display:flex; align-items:center; gap:10px; margin-bottom:10px;
  }
  .qid{
    font-family:var(--mono);
    font-size:11px;
    color:var(--bg);
    background:var(--ink-dim);
    padding:3px 7px;
    border-radius:5px;
    letter-spacing:.03em;
    flex-shrink:0;
  }
  .qcat{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  .qtext{
    font-size:15px;
    font-weight:600;
    margin:0 0 12px;
    color:var(--ink);
  }
  .opt{
    display:flex;
    align-items:flex-start;
    gap:10px;
    width:100%;
    text-align:left;
    background:var(--bg-soft);
    border:1px solid var(--panel-border);
    color:var(--ink);
    padding:10px 12px;
    border-radius:10px;
    margin-bottom:8px;
    font-size:13.5px;
    cursor:pointer;
    font-family:var(--sans);
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .opt:last-child{margin-bottom:0;}
  .opt:hover{border-color:#3a5a86;}
  .opt:active{transform:scale(.99);}
  .opt .optkey{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    border:1px solid var(--panel-border);
    border-radius:5px;
    width:20px;height:20px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .opt.selected{
    border-color:var(--amber);
    background:rgba(232,168,60,.1);
  }
  .opt.selected .optkey{border-color:var(--amber);color:var(--amber);}

  .qcard.locked .opt{cursor:default;}
  .qcard.locked .opt:hover{border-color:var(--panel-border);}
  .opt.correct{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .opt.correct .optkey{border-color:var(--accent);color:var(--accent);}
  .opt.wrong{
    border-color:var(--alert);
    background:var(--alert-soft);
  }
  .opt.wrong .optkey{border-color:var(--alert);color:var(--alert);}

  .explain{
    display:none;
    margin-top:10px;
    padding:10px 12px;
    border-radius:10px;
    background:var(--bg-soft);
    border-left:3px solid var(--amber);
    font-size:12.5px;
    color:var(--ink-dim);
  }
  .explain.show{display:block;}
  .explain b{color:var(--ink);}

  /* ---------- Footer / evaluate bar ---------- */
  .evalbar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:linear-gradient(0deg, var(--bg) 60%, rgba(12,20,32,0));
    padding:22px 18px 16px;
  }
  .evalbar-inner{
    max-width:640px; margin:0 auto;
    display:flex; gap:10px; align-items:center;
  }
  .btn{
    border:none; border-radius:12px;
    font-family:var(--sans);
    font-weight:700;
    font-size:14.5px;
    padding:13px 18px;
    cursor:pointer;
    flex:1;
  }
  .btn-primary{
    background:var(--accent);
    color:#04211c;
  }
  .btn-primary:disabled{
    background:#2a3a4d; color:#5b6c81; cursor:not-allowed;
  }
  .btn-secondary{
    background:var(--panel);
    border:1px solid var(--panel-border);
    color:var(--ink);
    flex:0 0 auto;
  }
  .pending-note{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    text-align:center;
    margin-top:8px;
  }

  @media (min-width:640px){
    h1{font-size:23px;}
    .score-big{font-size:40px;}
  }
</style>
</head>
<body>

<header class="console">
  <div class="console-top">
    <div class="dot-row"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <span class="console-title">panel de control · perímetro</span>
  </div>
  <h1>Simulacro: Vulnerabilidad en Dispositivos Perimetrales</h1>
  <p class="subtitle">Selecciona la mejor respuesta. Preguntas 1–25 de 100 · basado en el material del curso.</p>
  <div class="gauge-wrap">
    <div class="gauge-track"><div class="gauge-fill" id="gaugeFill"></div></div>
    <span class="gauge-label" id="gaugeLabel">0 / 25</span>
  </div>
</header>

<div id="resultsBanner">
  <span class="score-tag">Resultado del simulacro</span>
  <div class="score-line">
    <span class="score-big" id="scoreBig">0/25</span>
    <span class="qcat" id="scorePct">0%</span>
  </div>
  <p class="verdict" id="scoreVerdict"></p>
</div>

<main id="quizContainer"></main>

<div class="evalbar">
  <div class="evalbar-inner">
    <button class="btn btn-secondary" id="resetBtn" title="Reiniciar intento">↺</button>
    <button class="btn btn-primary" id="evalBtn" disabled>Evaluar respuestas</button>
  </div>
  <p class="pending-note" id="pendingNote">Responde las 25 preguntas para habilitar la evaluación.</p>
</div>

<script>
/* =========================================================================
   BANCO DE PREGUNTAS
   Cada bloque de 25 se añade a este mismo arreglo QUESTIONS.
   Estructura: { id, cat, q, options:[4], correct: index, explain }
   ========================================================================= */
const QUESTIONS = [

// ---------- BLOQUE 1: PREGUNTAS 1-25 ----------
{
  "id":"Q01", "cat":"Fundamentos · ISO 27001",
  "q":"Un técnico afirma: “si un sistema tiene una vulnerabilidad, entonces sufrirá un ataque”. Según la definición de vulnerabilidad basada en ISO 27001 presentada en el documento, ¿qué corrige mejor esa afirmación?",
  "options":[
    "Las vulnerabilidades únicamente afectan software, nunca hardware ni procesos, así que el riesgo es limitado",
    "La vulnerabilidad y la amenaza son sinónimos, por lo que la afirmación es correcta tal cual",
    "La vulnerabilidad es la debilidad explotable; el ataque ocurre solo si además existe una amenaza que la explote",
    "Una vulnerabilidad solo existe si ya fue registrada con un identificador CVE"
  ],
  "correct":2,
  "explain":"El documento define la vulnerabilidad como una debilidad que <b>puede ser explotada por una o más amenazas</b>; sin una amenaza que la aproveche, la debilidad no se traduce automáticamente en un incidente."
},
{
  "id":"Q02", "cat":"Definiciones",
  "q":"Una empresa migra su firewall físico a una instancia de software corriendo en AWS. Según la explicación sobre la 'naturaleza' de los dispositivos perimetrales, ¿qué es lo correcto sobre este cambio?",
  "options":[
    "Se convierte en un dispositivo de Edge Computing y pierde su función de seguridad",
    "Sigue siendo un dispositivo perimetral porque lo que lo define es su función lógica y capacidad de decisión, no su forma física",
    "Solo puede considerarse perimetral si además está embebido dentro de un router",
    "Deja de ser un dispositivo perimetral porque ya no es hardware físico"
  ],
  "correct":1,
  "explain":"El texto aclara que lo que define a un dispositivo perimetral es <b>su función lógica y su capacidad autónoma de decisión</b> en el borde de la red, sin importar si es hardware, un appliance virtual o un módulo embebido."
},
{
  "id":"Q03", "cat":"Analogía castillo-foso",
  "q":"En la analogía de la fortaleza, si un IDS detecta tráfico sospechoso pero no toma ninguna acción para detenerlo, ¿qué rol de la analogía está cumpliendo y cuál le falta?",
  "options":[
    "Está actuando como muralla; le falta comportarse como DMZ",
    "Está actuando como IPS completo, no le falta nada",
    "Está actuando como centinela que solo vigila y alerta; le falta el rol del arquero (IPS) que neutraliza activamente",
    "Está actuando como router fronterizo; le falta filtrar paquetes"
  ],
  "correct":2,
  "explain":"El documento asigna al <b>IDS el rol del centinela que detecta y alerta</b> (el 'ojo'), mientras que el <b>IPS es el arquero que neutraliza</b> (el 'brazo'); detectar sin bloquear es exactamente la función del IDS, no la del IPS."
},
{
  "id":"Q04", "cat":"DMZ",
  "q":"Una organización coloca su servidor web público directamente en la red interna, junto a las bases de datos corporativas. ¿Qué principio de diseño perimetral está ignorando?",
  "options":[
    "La política de contraseñas fuertes exigida por NIST SP 800-63B",
    "La segmentación mediante DMZ, que aísla servidores de cara al público para limitar la exposición de la red principal si son comprometidos",
    "La actualización periódica del firmware del router fronterizo",
    "El uso de VPN para cifrar el tráfico de administradores"
  ],
  "correct":1,
  "explain":"La DMZ existe precisamente para <b>alojar servidores públicos separados de la red interna</b>, de modo que si el servidor expuesto es comprometido, el daño no se extienda directamente a los sistemas críticos."
},
{
  "id":"Q05", "cat":"Firewalls",
  "q":"Según el documento, un firewall 'no piensa por sí solo, obedece una lista de quién entra y quién no'. ¿Qué implicación práctica tiene esta idea para la seguridad de una organización?",
  "options":[
    "Los firewalls de nueva generación ya no requieren ningún tipo de configuración de reglas",
    "El firewall es capaz de detectar amenazas nuevas sin necesidad de reglas, gracias a su inteligencia propia",
    "La efectividad del firewall depende directamente de que sus reglas de acceso estén bien definidas y actualizadas, ya que solo ejecuta lo que se le configura",
    "El firewall reemplaza por completo la necesidad de un IDS/IPS"
  ],
  "correct":2,
  "explain":"Si el dispositivo solo <b>obedece reglas predefinidas</b>, entonces reglas mal diseñadas o desactualizadas dejan huecos reales de seguridad, sin importar qué tan avanzado sea el hardware."
},
{
  "id":"Q06", "cat":"Impacto económico",
  "q":"Una empresa argumenta que invertir en automatización de defensas perimetrales 'no se justifica económicamente'. ¿Qué dato del informe de IBM citado en el documento contradice directamente esa postura?",
  "options":[
    "El costo promedio global de una brecha alcanzó los USD 4.88 millones en 2024",
    "El 44% de los incidentes derivó en ransomware en el informe de 2025",
    "Las organizaciones que combinan defensas perimetrales con automatización lograron un ahorro medio de USD 2.2 millones por incidente",
    "El 36% de los routers de consumo no se actualizó en más de un año"
  ],
  "correct":2,
  "explain":"El dato que responde directamente al argumento del ahorro es el <b>ahorro medio de USD 2.2 millones por incidente</b> al combinar defensas perimetrales con automatización, mostrando un retorno concreto de la inversión."
},
{
  "id":"Q07", "cat":"Amenazas",
  "q":"Un empleado con acceso legítimo a la red copia información confidencial para venderla a un competidor. ¿En qué categoría de amenaza descrita en el documento encaja este caso, y por qué es distinta de las demás amenazas listadas?",
  "options":[
    "Explotación de vulnerabilidades conocidas, porque aprovecha software desactualizado",
    "Ataque de insiders, porque el atacante ya cuenta con acceso interno autorizado, a diferencia de amenazas externas como phishing o DDoS",
    "Ataque de botnets, porque usa múltiples dispositivos comprometidos",
    "Ataque de sniffing, porque intercepta datos en tránsito"
  ],
  "correct":1,
  "explain":"El documento define los <b>ataques de insiders</b> como acciones maliciosas de empleados o personas con acceso interno; a diferencia de amenazas externas, aquí el atacante no necesita vulnerar el perímetro porque ya está dentro."
},
{
  "id":"Q08", "cat":"Firmware · 'caja negra'",
  "q":"¿Por qué el documento describe al firmware de routers y firewalls como una 'caja negra' en términos de seguridad?",
  "options":[
    "Porque solo funciona en dispositivos de color negro fabricados por proveedores específicos",
    "Porque su código fuente siempre está cifrado y nadie puede auditarlo",
    "Porque impide físicamente cualquier tipo de actualización remota",
    "Porque, a diferencia de los sistemas operativos convencionales, puede pasar años sin recibir parches y muchos fabricantes tardan meses en responder a vulnerabilidades descubiertas"
  ],
  "correct":3,
  "explain":"La 'caja negra' se refiere a que el firmware queda <b>sin actualizaciones de seguridad durante años</b>, con fabricantes lentos en parchar, dejando vulnerabilidades conocidas expuestas de forma prolongada."
},
{
  "id":"Q09", "cat":"Firmware · fin de soporte",
  "q":"Un router llega a su 'fin de soporte' y sigue en producción. Según el documento, ¿cuál es el riesgo específico que esto agrava respecto a sus componentes de firmware?",
  "options":[
    "El dispositivo deja de transmitir tráfico de red por completo",
    "El fabricante asume automáticamente toda la responsabilidad legal ante cualquier incidente",
    "Los componentes de firmware, que suelen depender de versiones desactualizadas para mantener compatibilidad, ya no recibirán corrección de las vulnerabilidades y hallazgos acumulados",
    "El dispositivo se convierte automáticamente en un appliance virtual"
  ],
  "correct":2,
  "explain":"El fin de soporte implica que el fabricante <b>deja de actualizar el dispositivo</b>, mientras sus componentes dependen de versiones desactualizadas, dejando expuestos los cientos de hallazgos y vulnerabilidades detectados por imagen de firmware."
},
{
  "id":"Q10", "cat":"RCE",
  "q":"Un formulario web no valida correctamente la entrada del usuario y permite que un atacante envíe comandos que el servidor ejecuta directamente. ¿Qué tipo de vulnerabilidad ejemplifica mejor este escenario?",
  "options":[
    "Secuestro de sesión por ausencia de flags de seguridad",
    "Ejecución remota de código (RCE), habilitada por sanitización pobre de entrada, similar a la inyección SQL o de comandos",
    "Buffer overflow basado en heap",
    "Envenenamiento de DNS"
  ],
  "correct":1,
  "explain":"El documento indica que las <b>vulnerabilidades de RCE más comunes incluyen inyección de SQL o de comandos, habilitadas por sanitización pobre de entrada</b>, exactamente el mecanismo descrito en el escenario."
},
{
  "id":"Q11", "cat":"RCE",
  "q":"¿Por qué, según el documento, la ejecución remota de código (RCE) es especialmente atractiva para los atacantes en comparación con otras técnicas?",
  "options":[
    "Porque requiere que la víctima haga clic en un enlace de phishing",
    "Porque siempre requiere credenciales válidas previamente robadas",
    "Porque permite ejecutar comandos arbitrarios sin necesidad de presencia física ni interacción directa con el sistema objetivo, lo que explica que sea la base de aproximadamente el 80% de las vulnerabilidades principales",
    "Porque solo puede ejecutarse desde dentro de la red interna"
  ],
  "correct":2,
  "explain":"El texto señala que el RCE permite <b>ganar acceso sin requerir presencia física o interacción directa</b>, y que cerca del 80% de las vulnerabilidades principales están relacionadas con este tipo de ejecución remota."
},
{
  "id":"Q12", "cat":"Buffer overflow",
  "q":"Un atacante envía datos maliciosos que sobrescriben el puntero de retorno almacenado en la memoria de una aplicación, tomando el control de la ejecución. ¿Qué tipo de buffer overflow describe mejor este mecanismo?",
  "options":[
    "Envenenamiento de DNS aplicado a la memoria del sistema",
    "Ataque basado en pila (stack), la forma más común, donde se sobrescribe el puntero de retorno para transferir el control al atacante",
    "Bypass de autenticación mediante manipulación de parámetros",
    "Ataque basado en heap, por ser el más común y difícil de ejecutar"
  ],
  "correct":1,
  "explain":"El documento describe los <b>ataques basados en pila como la forma más común</b>, donde se sobrescriben datos en la pila, incluyendo el puntero de retorno, transfiriendo el control de ejecución al atacante."
},
{
  "id":"Q13", "cat":"Buffer overflow · lenguajes",
  "q":"¿Por qué el documento señala que muchas aplicaciones heredadas de firmware escritas en C o C++ son particularmente propensas a vulnerabilidades de buffer overflow?",
  "options":[
    "Porque estos lenguajes no permiten definir búferes de memoria",
    "Porque C y C++ solo se ejecutan en hardware antiguo sin memoria suficiente",
    "Porque carecen de protecciones integradas contra buffer overflow que sí ofrecen lenguajes modernos como Java, Perl o C#",
    "Porque siempre generan código que se ejecuta con privilegios de administrador"
  ],
  "correct":2,
  "explain":"El texto indica explícitamente que estas aplicaciones heredadas <b>carecen de protecciones integradas (built-in protections)</b> frente al desbordamiento de búfer que sí existen en lenguajes más modernos."
},
{
  "id":"Q14", "cat":"Ciclo de vida · zero-day",
  "q":"Durante la ventana zero-day, ¿por qué el documento afirma que los defensores están en una posición particularmente débil?",
  "options":[
    "Porque los atacantes deben revelar públicamente la vulnerabilidad antes de explotarla",
    "Porque no hay solución oficial disponible y, además, el comportamiento del ataque puede no activar firmas de amenaza conocidas ni sistemas de detección de anomalías",
    "Porque ya existe un parche público pero nadie lo ha instalado todavía",
    "Porque el firewall bloquea automáticamente cualquier tráfico desconocido durante esta fase"
  ],
  "correct":1,
  "explain":"El documento explica que en la fase zero-day <b>no existe parche oficial</b> y que la detección es difícil porque el comportamiento del ataque <b>puede no activar firmas conocidas</b>, dejando a los defensores sin forma directa de cerrar la brecha."
},
{
  "id":"Q15", "cat":"Vulnerabilidades N-day",
  "q":"Una empresa fue comprometida explotando una vulnerabilidad que ya tenía un parche público disponible desde hacía meses. ¿Cómo clasifica el documento este tipo de caso y qué estadística lo respalda?",
  "options":[
    "Como un ataque zero-day, ya que ninguna vulnerabilidad con parche puede ser explotada de nuevo",
    "Como spoofing, porque el atacante falsificó la identidad de origen",
    "Como un ataque de sniffing, porque implica interceptación de datos en tránsito",
    "Como una vulnerabilidad N-day; el documento señala que aproximadamente el 40% de los ataques a redes industriales explota vulnerabilidades conocidas con parches disponibles pero no remediadas"
  ],
  "correct":3,
  "explain":"El documento define las <b>vulnerabilidades 'N-day'</b> como aquellas con parche disponible pero no aplicado, y cita que cerca del <b>40% de los ataques a redes industriales</b> explota justamente este tipo de brechas ya conocidas."
},
{
  "id":"Q16", "cat":"Control de acceso",
  "q":"Un usuario común descubre que, cambiando manualmente un identificador en la URL, puede ver los datos de otro usuario sin necesitar credenciales adicionales. ¿Qué categoría de falla ilustra mejor este caso?",
  "options":[
    "Buffer overflow basado en heap",
    "Envenenamiento de DNS",
    "Ataque de botnets coordinado",
    "Fallos en el control de acceso, que ocupan el #1 del OWASP Top 10 desde 2021 y permiten escalada horizontal sin explotar vulnerabilidades técnicas complejas"

/* =========================================================================
   MOTOR DEL SIMULADOR
   ========================================================================= */
const state = { answers: {}, evaluated: false };

const quizContainer = document.getElementById('quizContainer');
const evalBtn = document.getElementById('evalBtn');
const resetBtn = document.getElementById('resetBtn');
const gaugeFill = document.getElementById('gaugeFill');
const gaugeLabel = document.getElementById('gaugeLabel');
const pendingNote = document.getElementById('pendingNote');
const resultsBanner = document.getElementById('resultsBanner');
const scoreBig = document.getElementById('scoreBig');
const scorePct = document.getElementById('scorePct');
const scoreVerdict = document.getElementById('scoreVerdict');

function render(){
  quizContainer.innerHTML = QUESTIONS.map((item, qIndex) => {
    const optsHtml = item.options.map((opt, oIndex) => {
      return `<button class="opt" data-q="${qIndex}" data-o="${oIndex}" type="button">
                <span class="optkey">${String.fromCharCode(65+oIndex)}</span>
                <span>${opt}</span>
              </button>`;
    }).join('');
    return `<article class="qcard" id="card-${qIndex}">
        <div class="qhead">
          <span class="qid">${item.id}</span>
          <span class="qcat">${item.cat}</span>
        </div>
        <p class="qtext">${item.q}</p>
        <div class="opts">${optsHtml}</div>
        <div class="explain" id="explain-${qIndex}"></div>
      </article>`;
  }).join('');

  quizContainer.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', onSelect);
  });
}

function onSelect(e){
  if(state.evaluated) return;
  const btn = e.currentTarget;
  const q = btn.dataset.q;
  const o = Number(btn.dataset.o);
  state.answers[q] = o;

  document.querySelectorAll(`.opt[data-q="${q}"]`).forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById(`card-${q}`).classList.add('answered');

  updateProgress();
}

function updateProgress(){
  const answered = Object.keys(state.answers).length;
  const total = QUESTIONS.length;
  gaugeFill.style.width = `${(answered/total)*100}%`;
  gaugeLabel.textContent = `${answered} / ${total}`;
  evalBtn.disabled = answered < total || state.evaluated;
  pendingNote.textContent = state.evaluated
    ? "Simulacro evaluado. Revisa el detalle en cada pregunta."
    : (answered < total
        ? `Responde las ${total} preguntas para habilitar la evaluación. Faltan ${total-answered}.`
        : "Todas las preguntas respondidas. Puedes evaluar.");
}

function evaluate(){
  if(Object.keys(state.answers).length < QUESTIONS.length) return;
  state.evaluated = true;
  let correctCount = 0;

  QUESTIONS.forEach((item, qIndex) => {
    const chosen = state.answers[qIndex];
    const card = document.getElementById(`card-${qIndex}`);
    card.classList.add('locked');

    document.querySelectorAll(`.opt[data-q="${qIndex}"]`).forEach((btn) => {
      const oIndex = Number(btn.dataset.o);
      if(oIndex === item.correct) btn.classList.add('correct');
      if(oIndex === chosen && chosen !== item.correct) btn.classList.add('wrong');
    });

    if(chosen === item.correct) correctCount++;

    const ex = document.getElementById(`explain-${qIndex}`);
    ex.innerHTML = item.explain;
    ex.classList.add('show');
  });

  const total = QUESTIONS.length;
  const pct = Math.round((correctCount/total)*100);
  scoreBig.textContent = `${correctCount}/${total}`;
  scorePct.textContent = `${pct}%`;
  scoreVerdict.textContent = pct >= 80
    ? "Perímetro sólido: dominas los conceptos clave del tema."
    : pct >= 60
      ? "Perímetro parcialmente cubierto: repasa las explicaciones marcadas en rojo."
      : "Perímetro expuesto: conviene reforzar la lectura del material antes de continuar.";
  resultsBanner.classList.add('show');
  resultsBanner.scrollIntoView({behavior:'smooth', block:'start'});

  updateProgress();
}

function resetQuiz(){
  state.answers = {};
  state.evaluated = false;
  resultsBanner.classList.remove('show');
  render();
  updateProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

evalBtn.addEventListener('click', evaluate);
resetBtn.addEventListener('click', resetQuiz);

render();
updateProgress();
</script>
